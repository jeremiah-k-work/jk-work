<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>jnb — admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@300;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0a;
    --surface:   #111111;
    --surface2:  #181818;
    --border:    rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.18);
    --red:       #c8001e;
    --cyan:      #00c8a0;
    --yellow:    #c8a000;
    --white:     #ffffff;
    --muted:     rgba(255,255,255,0.35);
    --font-ui:   'Unbounded', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius:    10px;
    --ease:      cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-mono);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
    z-index: 100;
    background: var(--bg);
    transition: opacity 0.4s ease;
  }
  #login-screen.hidden { opacity: 0; pointer-events: none; }
  .login-logo {
    font-family: var(--font-ui);
    font-size: 11px; font-weight: 300;
    letter-spacing: 0.4em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .login-title {
    font-family: var(--font-ui);
    font-size: 28px; font-weight: 900;
    letter-spacing: -0.02em; color: var(--white);
  }
  .login-form { display: flex; flex-direction: column; gap: 12px; width: 300px; }
  .login-form input {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--white); font-family: var(--font-mono);
    font-size: 13px; padding: 12px 16px; border-radius: var(--radius);
    outline: none; transition: border-color 0.15s; letter-spacing: 0.05em;
  }
  .login-form input:focus { border-color: var(--border-hi); }
  .login-form input.error { border-color: var(--red); }
  .login-error { font-size: 11px; color: var(--red); text-align: center; letter-spacing: 0.05em; min-height: 16px; }

  /* ── BUTTONS ── */
  .btn-primary {
    background: var(--white); color: var(--bg); border: none;
    font-family: var(--font-ui); font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 13px 24px; border-radius: var(--radius);
    cursor: pointer; transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }

  .btn-add {
    background: var(--red); border: none; color: var(--white);
    font-family: var(--font-ui); font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 8px 16px; border-radius: 6px; cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-add:hover { opacity: 0.85; }

  .btn-save {
    background: var(--cyan); color: var(--bg); border: none;
    font-family: var(--font-ui); font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    padding: 10px 20px; border-radius: 6px; cursor: pointer;
    margin-top: 16px; transition: opacity 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-save:hover { opacity: 0.85; }
  .btn-save.saving { opacity: 0.6; pointer-events: none; }

  .btn-icon {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; padding: 5px 10px;
    border-radius: 5px; cursor: pointer; font-family: var(--font-mono);
    letter-spacing: 0.05em; transition: color 0.15s, border-color 0.15s;
  }
  .btn-icon:hover { color: var(--white); border-color: var(--border-hi); }
  .btn-icon:disabled { opacity: 0.3; pointer-events: none; }
  .btn-icon.danger:hover { color: var(--red); border-color: var(--red); }

  .btn-logout {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); font-family: var(--font-mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-logout:hover { color: var(--white); border-color: var(--border-hi); }

  /* ── ADMIN SHELL ── */
  #admin-shell { display: none; min-height: 100vh; }
  #admin-shell.visible { display: block; }

  .admin-header {
    position: sticky; top: 0;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 50;
  }
  .admin-header-left { display: flex; align-items: center; gap: 16px; }
  .admin-wordmark {
    font-family: var(--font-ui); font-size: 11px; font-weight: 900;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--white);
  }
  .admin-badge {
    font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.15em;
    color: var(--muted); background: var(--surface);
    border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px;
    text-transform: uppercase;
  }

  /* ── TABS ── */
  .admin-tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
  }
  .tab-btn {
    background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--muted); font-family: var(--font-ui); font-size: 9px;
    font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 14px 20px; cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    margin-bottom: -1px;
  }
  .tab-btn:hover { color: var(--white); }
  .tab-btn.active { color: var(--white); border-bottom-color: var(--white); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* ── MAIN CONTENT ── */
  .admin-main { max-width: 960px; margin: 0 auto; padding: 40px 32px 80px; }

  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-title {
    font-family: var(--font-ui); font-size: 11px; font-weight: 700;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted);
  }

  /* ── PHOTO CARDS ── */
  #photo-list { display: flex; flex-direction: column; gap: 2px; }

  .photo-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
    transition: border-color 0.15s;
  }
  .photo-card:hover { border-color: var(--border-hi); }
  .photo-card.unpublished { opacity: 0.55; }

  .photo-card-header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; cursor: pointer; user-select: none;
  }
  .drag-handle { color: var(--muted); font-size: 14px; cursor: grab; flex-shrink: 0; opacity: 0.4; }

  .photo-thumb {
    width: 44px; height: 44px; object-fit: cover;
    border-radius: 6px; background: #1a1a1a; flex-shrink: 0;
  }
  .photo-card-info { flex: 1; min-width: 0; }
  .photo-card-name {
    font-family: var(--font-ui); font-size: 12px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--white);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .photo-card-meta {
    display: flex; gap: 10px; align-items: center; margin-top: 3px;
  }
  .photo-card-src {
    font-size: 10px; color: var(--muted); letter-spacing: 0.04em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .badge-published {
    font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 3px; flex-shrink: 0;
    font-family: var(--font-ui); font-weight: 700;
  }
  .badge-published.yes { background: rgba(0,200,160,0.15); color: var(--cyan); }
  .badge-published.no  { background: rgba(200,0,30,0.15);  color: var(--red);  }

  .photo-card-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .expand-arrow {
    color: var(--muted); font-size: 10px; transition: transform 0.2s ease; flex-shrink: 0;
  }
  .photo-card.open .expand-arrow { transform: rotate(180deg); }

  /* ── EXPANDED EDITOR ── */
  .photo-card-editor { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
  .photo-card.open .photo-card-editor { display: block; }

  .editor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .editor-grid.triple { grid-template-columns: 1fr 1fr 1fr; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); font-family: var(--font-ui); font-weight: 700;
  }
  .field input[type="text"],
  .field input[type="number"] {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--white); font-family: var(--font-mono);
    font-size: 12px; padding: 9px 12px; border-radius: 6px;
    outline: none; transition: border-color 0.15s; letter-spacing: 0.03em; width: 100%;
  }
  .field input:focus { border-color: var(--border-hi); }
  .field input[type="range"] {
    -webkit-appearance: none; width: 100%; height: 2px;
    background: var(--border-hi); border-radius: 1px; outline: none; cursor: pointer; margin-top: 6px;
  }
  .field input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--white); cursor: pointer;
  }
  .slider-val { font-size: 10px; color: var(--muted); font-family: var(--font-mono); float: right; }

  /* Published toggle */
  .toggle-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .toggle-label {
    font-family: var(--font-ui); font-size: 9px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted);
  }
  .toggle {
    position: relative; width: 36px; height: 20px; cursor: pointer;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute; inset: 0; border-radius: 10px;
    background: var(--border-hi); transition: background 0.2s;
  }
  .toggle input:checked + .toggle-track { background: var(--cyan); }
  .toggle-thumb {
    position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--white); transition: transform 0.2s;
  }
  .toggle input:checked ~ .toggle-thumb { transform: translateX(16px); }

  /* Collections checkboxes */
  .collections-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .collection-chip {
    display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; cursor: pointer;
    transition: border-color 0.15s;
    font-size: 10px; font-family: var(--font-ui);
    font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); user-select: none;
  }
  .collection-chip:hover { border-color: var(--border-hi); color: var(--white); }
  .collection-chip.active { border-color: var(--cyan); color: var(--cyan); }
  .collection-chip input { display: none; }

  /* Credits */
  .credits-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .credit-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px;
  }
  .credit-name { font-size: 11px; font-family: var(--font-ui); font-weight: 700; flex: 1; }
  .credit-role {
    font-size: 10px; color: var(--muted);
    font-family: var(--font-mono); letter-spacing: 0.05em;
  }

  /* People search */
  .people-search-wrap { position: relative; }
  .people-search-wrap input {
    background: var(--bg); border: 1px solid var(--border);
    color: var(--white); font-family: var(--font-mono);
    font-size: 12px; padding: 9px 12px; border-radius: 6px;
    outline: none; width: 100%; transition: border-color 0.15s;
  }
  .people-search-wrap input:focus { border-color: var(--border-hi); }
  .people-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--surface2); border: 1px solid var(--border-hi);
    border-radius: 6px; z-index: 30; overflow: hidden;
    display: none;
  }
  .people-dropdown.open { display: block; }
  .people-option {
    padding: 10px 12px; cursor: pointer; font-size: 11px;
    font-family: var(--font-ui); font-weight: 700;
    letter-spacing: 0.05em; transition: background 0.1s;
  }
  .people-option:hover { background: var(--border); }
  .people-option.create-new { color: var(--cyan); }

  /* Zoom anchor */
  .zoom-anchor-wrap {
    position: relative; width: 100%; aspect-ratio: 3/4;
    border-radius: 6px; overflow: hidden; cursor: crosshair;
    background: #1a1a1a; border: 1px solid var(--border);
  }
  .zoom-anchor-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; image-rendering: pixelated; }
  .zoom-anchor-dot {
    position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: var(--cyan); border: 2px solid var(--white);
    transform: translate(-50%, -50%); pointer-events: none;
    box-shadow: 0 0 0 3px rgba(0,200,160,0.3);
    transition: left 0.15s ease, top 0.15s ease;
  }
  .zoom-anchor-hint { font-size: 9px; color: var(--muted); letter-spacing: 0.08em; margin-top: 4px; }

  /* ── PEOPLE TAB ── */
  #people-list { display: flex; flex-direction: column; gap: 2px; }
  .person-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s;
  }
  .person-card:hover { border-color: var(--border-hi); }
  .person-card-header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; cursor: pointer; user-select: none;
  }
  .person-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-ui); font-size: 11px; font-weight: 900;
    color: var(--muted); flex-shrink: 0;
  }
  .person-name {
    font-family: var(--font-ui); font-size: 12px; font-weight: 700;
    letter-spacing: 0.05em; color: var(--white); flex: 1;
  }
  .person-handle { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .person-editor { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
  .person-card.open .person-editor { display: block; }
  .person-card.open .expand-arrow { transform: rotate(180deg); }

  /* ── NEW PANELS ── */
  .new-panel {
    display: none; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 16px;
  }
  .new-panel.visible { display: block; }
  .new-panel-title {
    font-family: var(--font-ui); font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase; color: var(--white); margin-bottom: 16px;
  }

  /* ── COLLECTION PHOTO ROW ── */
  .coll-photo-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 12px;
  }

  /* ── LOADING ── */
  .loading-row {
    padding: 40px; text-align: center; color: var(--muted);
    font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  }

  /* ── TOAST ── */
  #toast {
    position: fixed; bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface); border: 1px solid var(--border-hi);
    color: var(--white); font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.08em; padding: 10px 20px; border-radius: 8px;
    opacity: 0; pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s var(--ease);
    z-index: 200; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { border-color: var(--cyan); color: var(--cyan); }
  #toast.error   { border-color: var(--red);  color: var(--red);  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">jnb visions</div>
  <div class="login-title">Admin</div>
  <form class="login-form" onsubmit="attemptLogin(event)">
    <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button type="submit" class="btn-primary">Enter</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- ADMIN SHELL -->
<div id="admin-shell">
  <header class="admin-header">
    <div class="admin-header-left">
      <span class="admin-wordmark">jnb visions</span>
      <span class="admin-badge">Gallery Admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">Log out</button>
  </header>

  <nav class="admin-tabs">
    <button class="tab-btn active" onclick="switchTab('photos')">Photos</button>
    <button class="tab-btn" onclick="switchTab('people')">People</button>
    <button class="tab-btn" onclick="switchTab('collections')">Collections</button>
  </nav>

  <!-- PHOTOS TAB -->
  <div id="tab-photos" class="tab-panel active">
    <div class="admin-main">

      <!-- UNREGISTERED -->
      <div id="unregistered-section" style="display:none;margin-bottom:32px">
        <div class="section-header" style="margin-bottom:12px">
          <span class="section-title">Unregistered Photos</span>
          <span id="unregistered-count" class="admin-badge"></span>
        </div>
        <div id="unregistered-list" style="display:flex;flex-direction:column;gap:2px"></div>
      </div>

      <!-- NEW PHOTO PANEL -->
      <div id="new-photo-panel" class="new-panel">
        <div class="new-panel-title">Add Photo</div>
        <div class="editor-grid">
          <div class="field">
            <label>Filename</label>
            <input type="text" id="new-src" placeholder="photo.jpg">
          </div>
          <div class="field">
            <label>Published</label>
            <label class="toggle" style="margin-top:8px">
              <input type="checkbox" id="new-published" checked>
              <div class="toggle-track"></div>
              <div class="toggle-thumb"></div>
            </label>
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn-save" onclick="createPhoto()">Save Photo</button>
          <button class="btn-icon" onclick="closeNewPanel()">Cancel</button>
        </div>
      </div>

      <!-- PHOTO LIST -->
      <div class="section-header">
        <span class="section-title">Photos</span>
        <button class="btn-add" onclick="openNewPanel()">+ Add Photo</button>
      </div>
      <div id="photo-list"><div class="loading-row">Loading...</div></div>

    </div>
  </div>

  <!-- PEOPLE TAB -->
  <div id="tab-people" class="tab-panel">
    <div class="admin-main">

      <!-- NEW PERSON PANEL -->
      <div id="new-person-panel" class="new-panel">
        <div class="new-panel-title">Add Person</div>
        <div class="editor-grid">
          <div class="field"><label>First Name</label><input type="text" id="np-first"></div>
          <div class="field"><label>Last Name</label><input type="text" id="np-last"></div>
          <div class="field"><label>Instagram</label><input type="text" id="np-instagram" placeholder="@handle"></div>
          <div class="field"><label>Website</label><input type="text" id="np-website" placeholder="https://"></div>
        </div>
        <div class="field" style="margin-top:12px">
          <label>Notes</label>
          <input type="text" id="np-notes" placeholder="Optional notes">
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn-save" onclick="createPerson()">Save Person</button>
          <button class="btn-icon" onclick="closeNewPersonPanel()">Cancel</button>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">People</span>
        <button class="btn-add" onclick="openNewPersonPanel()">+ Add Person</button>
      </div>
      <div id="people-list"><div class="loading-row">Loading...</div></div>

    </div>
  </div>
<!-- COLLECTIONS TAB -->
  <div id="tab-collections" class="tab-panel">
    <div class="admin-main">

      <!-- NEW COLLECTION PANEL -->
      <div id="new-collection-panel" class="new-panel">
        <div class="new-panel-title">Add Collection</div>
        <div class="editor-grid">
          <div class="field">
            <label>Label</label>
            <input type="text" id="nc-label" placeholder="Portraits">
          </div>
          <div class="field">
            <label>Slug</label>
            <input type="text" id="nc-slug" placeholder="portraits">
          </div>
        </div>
        <div style="display:flex;gap:10px;margin-top:12px">
          <button class="btn-save" onclick="createCollection()">Save Collection</button>
          <button class="btn-icon" onclick="closeNewCollectionPanel()">Cancel</button>
        </div>
      </div>

      <div class="section-header">
        <span class="section-title">Collections</span>
        <button class="btn-add" onclick="openNewCollectionPanel()">+ Add Collection</button>
      </div>
      <div id="collections-list"><div class="loading-row">Loading...</div></div>

    </div>
  </div>

</div>

<div id="toast"></div>

<script>
/* =====================================================
   CONFIG

/* =====================================================
   SUPABASE
   ===================================================== */
const SB_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, { headers: SB_HEADERS, ...opts });
  if (!res.ok) { const e = await res.text(); throw new Error(e); }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* =====================================================

let people      = [];
let collections = [];

// Map of photo_id -> array of {person_id, role, people:{first_name,last_name}}

/* =====================================================

   ===================================================== */
async function init() {
  await Promise.all([ loadCollections(), loadPeople() ]);

/* =====================================================
   LOAD COLLECTIONS
   ===================================================== */
async function loadCollections() {
  try {
    collections = await sbFetch('/rest/v1/collections?select=*&order=display_order.asc');
  } catch (err) {
    console.warn('Could not load collections:', err.message);
    collections = [];
  }
}

/* =====================================================
   LOAD PEOPLE
   ===================================================== */
async function loadPeople(attempt = 1) {
  try {
    people = await sbFetch('/rest/v1/people?select=*&order=last_name.asc,first_name.asc');
    renderPeopleList();
  } catch (err) {
    if (attempt < 3) setTimeout(() => loadPeople(attempt + 1), 2000);
    else document.getElementById('people-list').innerHTML =
      `<div class="loading-row" style="color:var(--red)">Could not load people. <button class="btn-add" onclick="loadPeople()" style="margin-left:8px">Retry</button></div>`;

/* =====================================================
   LOAD PHOTOS
   ===================================================== */
async function loadPhotos(attempt = 1) {
  const list = document.getElementById('photo-list');
  list.innerHTML = attempt === 1
    ? '<div class="loading-row">Loading...</div>'
    : `<div class="loading-row">Connecting... (attempt ${attempt} of 3)</div>`;

  try {
    // Load photos, their collection memberships, and their credits in parallel
    const [rawPhotos, rawCollMemberships, rawCredits] = await Promise.all([
      sbFetch('/rest/v1/photos?select=*&order=display_order.asc'),
      sbFetch('/rest/v1/photo_collections?select=*'),
      sbFetch('/rest/v1/photo_credits?select=photo_id,role,person_id,people(id,first_name,last_name)')
    ]);

    photos = rawPhotos;

    // Build photo -> collections map
    photoCollectionsMap = {};
    rawCollMemberships.forEach(m => {
      if (!photoCollectionsMap[m.photo_id]) photoCollectionsMap[m.photo_id] = [];
      photoCollectionsMap[m.photo_id].push(m);
    });

    // Build photo -> credits map
    photoCreditsMap = {};
    rawCredits.forEach(c => {
      if (!photoCreditsMap[c.photo_id]) photoCreditsMap[c.photo_id] = [];
      photoCreditsMap[c.photo_id].push(c);
    });

    renderPhotoList();
    loadUnregistered();
  } catch (err) {
    if (attempt < 3) { setTimeout(() => loadPhotos(attempt + 1), 2000); return; }
    list.innerHTML = `
      <div class="loading-row" style="display:flex;flex-direction:column;gap:14px;align-items:center">
        <span style="color:var(--red)">Could not reach the database.</span>
        <span style="color:var(--muted);font-size:10px">${err.message}</span>
        <button class="btn-add" onclick="loadPhotos()">Try Again</button>
      </div>`;
  }
}

  try {
    const res = await fetch('/api/photos');
    if (!res.ok) throw new Error('API unavailable');
    const data = await res.json();
    const files = data.files || [];
    const registered = new Set(photos.map(p => p.src));
    const unregistered = files.filter(f => !registered.has(f));

    const section = document.getElementById('unregistered-section');
    const listEl  = document.getElementById('unregistered-list');
    const count   = document.getElementById('unregistered-count');

    if (!unregistered.length) { section.style.display = 'none'; return; }

    section.style.display = 'block';
    count.textContent = `${unregistered.length} new`;

    listEl.innerHTML = unregistered.map(filename => `
      <div class="photo-card" style="display:flex;align-items:center;gap:16px;padding:12px 18px">
        <img style="width:44px;height:44px;object-fit:cover;border-radius:6px;background:#1a1a1a;flex-shrink:0"

        <div style="flex:1;min-width:0">

  } catch (err) {
    console.warn('[admin] Directory scan unavailable:', err.message);
  }
}

/* =====================================================
   PHOTO ACTIONS
   ===================================================== */
async function togglePublished(photoId, val) {
  try {
    await sbFetch(`/rest/v1/photos?id=eq.${photoId}`, {
      method: 'PATCH', body: JSON.stringify({ published: val })
    });
    const p = photos.find(x => x.id === photoId);
    if (p) p.published = val;
    const card = document.getElementById(`card-${photoId}`);
    if (card) {
      card.classList.toggle('unpublished', !val);
      const badge = card.querySelector('.badge-published');
      if (badge) { badge.textContent = val ? 'Live' : 'Draft'; badge.className = `badge-published ${val?'yes':'no'}`; }
    }
    showToast(val ? 'Published' : 'Unpublished', 'success');
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function toggleCollection(photoId, collectionId, chipEl) {
  const isActive = chipEl.classList.contains('active');
  try {
    if (isActive) {
      await sbFetch(`/rest/v1/photo_collections?photo_id=eq.${photoId}&collection_id=eq.${collectionId}`,
        { method: 'DELETE' });
      if (photoCollectionsMap[photoId])
        photoCollectionsMap[photoId] = photoCollectionsMap[photoId].filter(m => m.collection_id !== collectionId);
      chipEl.classList.remove('active');
    } else {
      const order = (photoCollectionsMap[photoId] || []).length + 1;
      await sbFetch('/rest/v1/photo_collections', {
        method: 'POST',
        body: JSON.stringify({ photo_id: photoId, collection_id: collectionId, display_order: order })
      });
      if (!photoCollectionsMap[photoId]) photoCollectionsMap[photoId] = [];
      photoCollectionsMap[photoId].push({ photo_id: photoId, collection_id: collectionId, display_order: order });
      chipEl.classList.add('active');
    }
    showToast(isActive ? 'Removed from collection' : 'Added to collection', 'success');
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function removeCredit(photoId, personId, role) {
  try {
    await sbFetch(`/rest/v1/photo_credits?photo_id=eq.${photoId}&person_id=eq.${personId}&role=eq.${role}`,
      { method: 'DELETE' });
    if (photoCreditsMap[photoId])
      photoCreditsMap[photoId] = photoCreditsMap[photoId].filter(
        c => !(c.person_id === personId && c.role === role));
    // Re-render credits list only
    const credEl = document.getElementById(`credits-${photoId}`);
    if (credEl) {
      const credits = photoCreditsMap[photoId] || [];
      credEl.innerHTML = credits.length
        ? credits.map(c => `
          <div class="credit-row">
            <span class="credit-name">${c.people ? c.people.first_name+' '+c.people.last_name : '—'}</span>
            <span class="credit-role">${c.role}</span>
            <button class="btn-icon danger" onclick="removeCredit('${photoId}','${c.person_id}','${c.role}')">×</button>
          </div>`).join('')
        : '<div style="font-size:10px;color:var(--muted);padding:4px 0">No credits yet.</div>';
    }
    showToast('Credit removed', 'success');
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function addCredit(photoId, personId) {
  const role = document.getElementById(`credit-role-${photoId}`).value.trim() || 'subject';
  try {
    await sbFetch('/rest/v1/photo_credits', {
      method: 'POST',
      body: JSON.stringify({ photo_id: photoId, person_id: personId, role })
    });
    const person = people.find(p => p.id === personId);
    if (!photoCreditsMap[photoId]) photoCreditsMap[photoId] = [];
    photoCreditsMap[photoId].push({ photo_id: photoId, person_id: personId, role, people: person });
    // Re-render credits list
    const credEl = document.getElementById(`credits-${photoId}`);
    if (credEl) {
      const credits = photoCreditsMap[photoId];
      credEl.innerHTML = credits.map(c => `
        <div class="credit-row">
          <span class="credit-name">${c.people ? c.people.first_name+' '+c.people.last_name : '—'}</span>
          <span class="credit-role">${c.role}</span>
          <button class="btn-icon danger" onclick="removeCredit('${photoId}','${c.person_id}','${c.role}')">×</button>
        </div>`).join('');
    }
    document.getElementById(`credit-search-${photoId}`).value = '';
    closeDropdown(photoId);
    showToast('Credit added', 'success');
  } catch (err) {
    if (err.message.includes('duplicate') || err.message.includes('unique')) {
      showToast('This person already has this role', 'error');
    } else {
      showToast('Error: ' + err.message, 'error');
    }
  }
}

async function savePhoto(id) {
  const btn = document.querySelector(`#card-${id} .btn-save`);
  btn.classList.add('saving'); btn.textContent = 'Saving...';
  const dot = document.getElementById(`anchor-dot-${id}`);
  const p   = photos.find(x => x.id === id);
  const ax  = dot.dataset.x !== undefined ? parseInt(dot.dataset.x) : parseFloat(p?.zoom_anchor_x ?? 50);
  const ay  = dot.dataset.y !== undefined ? parseInt(dot.dataset.y) : parseFloat(p?.zoom_anchor_y ?? 50);
  try {
    await sbFetch(`/rest/v1/photos?id=eq.${id}`, {
      method: 'PATCH',
      body: JSON.stringify({
        src:           document.getElementById(`src-${id}`).value.trim(),
        logo_y:        parseFloat(document.getElementById(`logoY-${id}`).value),
        info_y:        parseFloat(document.getElementById(`infoY-${id}`).value),
        zoom_anchor_x: ax, zoom_anchor_y: ay,
        zoom_ratio:    parseFloat(document.getElementById(`ratio-${id}`).value)
      })
    });
    showToast('Saved', 'success');
    await loadPhotos();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
    btn.classList.remove('saving'); btn.textContent = 'Save Changes';
  }
}

async function createPhoto() {
  const src       = document.getElementById('new-src').value.trim();
  const published = document.getElementById('new-published').checked;
  if (!src) { showToast('Filename is required', 'error'); return; }
  try {
    const order = photos.length ? Math.max(...photos.map(p => p.display_order)) + 1 : 1;
    const [newPhoto] = await sbFetch('/rest/v1/photos', {
      method: 'POST',
      body: JSON.stringify({
        src, published, display_order: order,
        logo_y: 50, info_y: 55, zoom_anchor_x: 50, zoom_anchor_y: 50, zoom_ratio: 0.65
      })
    });
    // Auto-add to portraits collection
    const portraits = collections.find(c => c.slug === 'portraits');
    if (portraits && newPhoto) {
      await sbFetch('/rest/v1/photo_collections', {
        method: 'POST',
        body: JSON.stringify({ photo_id: newPhoto.id, collection_id: portraits.id, display_order: order })
      });
    }
    showToast('Photo added', 'success');
    closeNewPanel();
    await loadPhotos();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function deletePhoto(id) {
  if (!confirm('Delete this photo entry? The image file is unaffected.')) return;
  try {
    await sbFetch(`/rest/v1/photos?id=eq.${id}`, { method: 'DELETE' });
    showToast('Deleted', 'success');
    await loadPhotos();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function movePhoto(id, direction) {
  const idx = photos.findIndex(p => p.id === id);
  const swapIdx = idx + direction;
  if (swapIdx < 0 || swapIdx >= photos.length) return;
  const a = photos[idx], b = photos[swapIdx];
  try {
    await Promise.all([
      sbFetch(`/rest/v1/photos?id=eq.${a.id}`, { method: 'PATCH', body: JSON.stringify({ display_order: b.display_order }) }),
      sbFetch(`/rest/v1/photos?id=eq.${b.id}`, { method: 'PATCH', body: JSON.stringify({ display_order: a.display_order }) })
    ]);
    await loadPhotos();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

/* =====================================================
   PEOPLE ACTIONS
   ===================================================== */
async function createPerson() {
  const first = document.getElementById('np-first').value.trim();
  const last  = document.getElementById('np-last').value.trim();
  if (!first && !last) { showToast('Name is required', 'error'); return; }
  try {
    await sbFetch('/rest/v1/people', {
      method: 'POST',
      body: JSON.stringify({
        first_name: first, last_name: last,
        instagram: document.getElementById('np-instagram').value.trim(),
        website:   document.getElementById('np-website').value.trim(),
        notes:     document.getElementById('np-notes').value.trim()
      })
    });
    showToast('Person added', 'success');
    closeNewPersonPanel();
    await loadPeople();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function savePerson(id) {
  const btn = document.querySelector(`#pcard-${id} .btn-save`);
  btn.classList.add('saving'); btn.textContent = 'Saving...';
  try {
    await sbFetch(`/rest/v1/people?id=eq.${id}`, {
      method: 'PATCH',
      body: JSON.stringify({
        first_name: document.getElementById(`pfirst-${id}`).value.trim(),
        last_name:  document.getElementById(`plast-${id}`).value.trim(),
        instagram:  document.getElementById(`pig-${id}`).value.trim(),
        website:    document.getElementById(`pweb-${id}`).value.trim(),
        notes:      document.getElementById(`pnotes-${id}`).value.trim()
      })
    });
    showToast('Saved', 'success');
    await loadPeople();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
    btn.classList.remove('saving'); btn.textContent = 'Save Changes';
  }
}

async function deletePerson(id) {
  if (!confirm('Delete this person? Their credits will also be removed.')) return;
  try {
    await sbFetch(`/rest/v1/people?id=eq.${id}`, { method: 'DELETE' });
    showToast('Deleted', 'success');
    await Promise.all([ loadPeople(), loadPhotos() ]);
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

/* =====================================================
   PEOPLE SEARCH / DROPDOWN
   ===================================================== */
function searchPeople(photoId, query) {
  const drop = document.getElementById(`people-drop-${photoId}`);
  const q = query.toLowerCase().trim();

  const matches = q.length < 1 ? people : people.filter(p =>
    `${p.first_name} ${p.last_name}`.toLowerCase().includes(q)
  );

  drop.innerHTML = [
    ...matches.slice(0, 6).map(p => `
      <div class="people-option"
           onclick="selectPerson('${photoId}','${p.id}','${p.first_name} ${p.last_name}')">
        ${p.first_name} ${p.last_name}
        ${p.instagram ? `<span style="color:var(--muted);font-size:9px;margin-left:6px">${p.instagram}</span>` : ''}
      </div>`),
    q.length > 1 ? `<div class="people-option create-new"
      onclick="createPersonAndCredit('${photoId}','${q}')">
      + Create "${query}"</div>` : ''
  ].join('');

  drop.classList.toggle('open', matches.length > 0 || q.length > 1);
}

function openDropdown(photoId) {
  searchPeople(photoId, document.getElementById(`credit-search-${photoId}`).value);
}

function closeDropdown(photoId) {
  const drop = document.getElementById(`people-drop-${photoId}`);
  if (drop) drop.classList.remove('open');
}

function selectPerson(photoId, personId, name) {
  document.getElementById(`credit-search-${photoId}`).value = name;
  closeDropdown(photoId);
  addCredit(photoId, personId);
}

async function createPersonAndCredit(photoId, query) {
  // Split query into first/last if space present
  const parts = query.trim().split(' ');
  const first = parts[0] || '';
  const last  = parts.slice(1).join(' ') || '';
  try {
    const [newPerson] = await sbFetch('/rest/v1/people', {
      method: 'POST',
      body: JSON.stringify({ first_name: first, last_name: last })
    });
    people.push(newPerson);
    people.sort((a, b) => a.last_name.localeCompare(b.last_name));
    renderPeopleList();
    closeDropdown(photoId);
    document.getElementById(`credit-search-${photoId}`).value = `${first} ${last}`.trim();
    await addCredit(photoId, newPerson.id);
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

// Close dropdowns when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('.people-search-wrap')) {
    document.querySelectorAll('.people-dropdown').forEach(d => d.classList.remove('open'));
  }
});

/* =====================================================
   ZOOM ANCHOR
   ===================================================== */
function attachZoomPicker(p) {
  const dot = document.getElementById(`anchor-dot-${p.id}`);
  if (dot) { dot.style.left = p.zoom_anchor_x + '%'; dot.style.top = p.zoom_anchor_y + '%'; }
}

function setZoomAnchor(id, event) {
  const wrap = document.getElementById(`anchor-wrap-${id}`);
  const rect = wrap.getBoundingClientRect();
  const x = Math.round(((event.clientX - rect.left) / rect.width)  * 100);
  const y = Math.round(((event.clientY - rect.top)  / rect.height) * 100);
  const dot = document.getElementById(`anchor-dot-${id}`);
  dot.style.left = x + '%'; dot.style.top = y + '%';
  document.getElementById(`anchor-val-${id}`).textContent = `${x}%, ${y}%`;
  dot.dataset.x = x; dot.dataset.y = y;
}

/* =====================================================
   CARD TOGGLES
   ===================================================== */
function toggleCard(id) { document.getElementById(`card-${id}`).classList.toggle('open'); }
function togglePersonCard(id) { document.getElementById(`pcard-${id}`).classList.toggle('open'); }

/* =====================================================
   NEW PANELS
   ===================================================== */
function openNewPanel() {

  document.getElementById('new-src').focus();
}
function closeNewPanel() {

}

}

/* =====================================================
   COLLECTIONS TAB
   ===================================================== */

function renderCollectionsList() {
  const list = document.getElementById('collections-list');
  if (!list) return;

  if (!collections.length) {
    list.innerHTML = '<div class="loading-row">No collections yet.</div>';
    return;
  }

  list.innerHTML = collections.map(c => {
    // Get all photos in this collection, sorted by their display_order
    const members = (Object.entries(photoCollectionsMap)
      .filter(([, memberships]) => memberships.some(m => m.collection_id === c.id))
      .map(([photoId, memberships]) => {
        const membership = memberships.find(m => m.collection_id === c.id);
        const photo = photos.find(p => p.id === photoId);
        return photo ? { ...photo, coll_order: membership.display_order } : null;
      })
      .filter(Boolean)
      .sort((a, b) => a.coll_order - b.coll_order));

    const photosHtml = members.length
      ? members.map((p, i) => {
          const credits = photoCreditsMap[p.id] || [];
          const subjects = credits.filter(c => c.role === 'subject' && c.people);
          const name = subjects.length
            ? subjects.map(s => `${s.people.first_name} ${s.people.last_name}`).join(', ')
            : (p.first_name ? `${p.first_name} ${p.last_name}` : p.src);
          return `
            <div class="coll-photo-row" id="collrow-${c.id}-${p.id}">
              <span class="drag-handle" style="opacity:0.4;font-size:14px">⠿</span>
              <img style="width:36px;height:36px;object-fit:cover;border-radius:5px;background:#1a1a1a;flex-shrink:0"
                   src="${PHOTO_PATH}${p.src}"
                   onerror="this.style.background='#2a2a2a';this.removeAttribute('src')" alt="">
              <div style="flex:1;min-width:0">
                <div style="font-family:var(--font-ui);font-size:11px;font-weight:700;
                            color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${name}</div>
                <div style="font-size:10px;color:var(--muted)">${p.src}
                  ${!p.published ? '<span style="color:var(--red);margin-left:6px;font-family:var(--font-ui);font-size:8px;font-weight:700;letter-spacing:0.1em">DRAFT</span>' : ''}
                </div>
              </div>
              <div style="display:flex;gap:6px;flex-shrink:0">
                <button class="btn-icon" onclick="moveInCollection('${c.id}','${p.id}',-1)" ${i===0?'disabled':''}>↑</button>
                <button class="btn-icon" onclick="moveInCollection('${c.id}','${p.id}',1)" ${i===members.length-1?'disabled':''}>↓</button>
                <button class="btn-icon danger" onclick="removeFromCollection('${c.id}','${p.id}')">Remove</button>
              </div>
            </div>`;
        }).join('')
      : '<div style="font-size:10px;color:var(--muted);padding:8px 0">No photos in this collection.</div>';

    return `
    <div class="person-card" id="collcard-${c.id}">
      <div class="person-card-header" onclick="toggleCollCard('${c.id}')">
        <div class="person-avatar" style="border-radius:6px;font-size:10px;letter-spacing:0.05em">${members.length}</div>
        <div style="flex:1;min-width:0">
          <div class="person-name">${c.label}</div>
          <div class="person-handle">${c.slug}</div>
        </div>
        <div style="display:flex;gap:8px" onclick="event.stopPropagation()">
          <button class="btn-icon danger" onclick="deleteCollection('${c.id}')">Delete</button>
        </div>
        <span class="expand-arrow">▼</span>
      </div>
      <div class="person-editor" id="colleditor-${c.id}">

        <!-- Collection label/slug edit -->
        <div class="editor-grid" style="margin-top:16px">
          <div class="field">
            <label>Label</label>
            <input type="text" id="clabel-${c.id}" value="${c.label}">
          </div>
          <div class="field">
            <label>Slug</label>
            <input type="text" id="cslug-${c.id}" value="${c.slug}">
          </div>
        </div>
        <button class="btn-save" onclick="saveCollection('${c.id}')" style="margin-bottom:16px">
          Save Collection
        </button>

        <!-- Photos in collection -->
        <div style="font-family:var(--font-ui);font-size:9px;font-weight:700;
                    letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);
                    margin-bottom:10px">Photos in this collection</div>
        <div id="coll-photos-${c.id}" style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px">
          ${photosHtml}
        </div>

        <!-- Add photo to collection -->
        <div class="field">
          <label>Add Photo</label>
          <div class="people-search-wrap">
            <input type="text" id="coll-search-${c.id}"
                   placeholder="Search by name or filename..."
                   oninput="searchPhotosForCollection('${c.id}', this.value)"
                   onfocus="openCollDropdown('${c.id}')"
                   autocomplete="off">
            <div class="people-dropdown" id="coll-drop-${c.id}"></div>
          </div>
        </div>

      </div>
    </div>`;
  }).join('');
}

function toggleCollCard(id) {
  const card = document.getElementById(`collcard-${id}`);
  card.classList.toggle('open');
}

/* Search photos to add to a collection */
function searchPhotosForCollection(collId, query) {
  const drop = document.getElementById(`coll-drop-${collId}`);
  const q = query.toLowerCase().trim();

  const candidates = q.length < 1 ? photos : photos.filter(p => {
    const credits = photoCreditsMap[p.id] || [];
    const subjects = credits.filter(c => c.role === 'subject' && c.people);
    const name = subjects.map(s => `${s.people.first_name} ${s.people.last_name}`).join(' ').toLowerCase();
    return name.includes(q) || p.src.toLowerCase().includes(q) ||
           (p.first_name + ' ' + p.last_name).toLowerCase().includes(q);
  });

  drop.innerHTML = candidates.slice(0, 8).map(p => {
    const credits = photoCreditsMap[p.id] || [];
    const subjects = credits.filter(c => c.role === 'subject' && c.people);
    const name = subjects.length
      ? subjects.map(s => `${s.people.first_name} ${s.people.last_name}`).join(', ')
      : (p.first_name ? `${p.first_name} ${p.last_name}` : p.src);
    const alreadyIn = (photoCollectionsMap[p.id] || []).some(m => {
      const coll = collections.find(c => c.id === collId);
      return coll && m.collection_id === coll.id;
    });
    return `
      <div class="people-option ${alreadyIn ? '' : ''}"
           onclick="addPhotoToCollection('${collId}','${p.id}')">
        <span style="display:flex;align-items:center;gap:8px">
          <img style="width:24px;height:24px;object-fit:cover;border-radius:3px;background:#1a1a1a"
               src="${PHOTO_PATH}${p.src}" onerror="this.style.background='#333';this.removeAttribute('src')">
          ${name}
          ${alreadyIn ? '<span style="color:var(--muted);font-size:9px;margin-left:4px">already in</span>' : ''}
        </span>
      </div>`;
  }).join('');

  drop.classList.toggle('open', candidates.length > 0);
}

function openCollDropdown(collId) {
  searchPhotosForCollection(collId, document.getElementById(`coll-search-${collId}`).value);
}

async function addPhotoToCollection(collId, photoId) {
  const coll = collections.find(c => c.id === collId);
  if (!coll) return;
  document.getElementById(`coll-drop-${collId}`).classList.remove('open');
  document.getElementById(`coll-search-${collId}`).value = '';

  const existingOrders = (Object.values(photoCollectionsMap)
    .flat()
    .filter(m => m.collection_id === collId)
    .map(m => m.display_order));
  const nextOrder = existingOrders.length ? Math.max(...existingOrders) + 1 : 1;

  try {
    await sbFetch('/rest/v1/photo_collections', {
      method: 'POST',
      body: JSON.stringify({ photo_id: photoId, collection_id: collId, display_order: nextOrder })
    });
    // Update local map
    if (!photoCollectionsMap[photoId]) photoCollectionsMap[photoId] = [];
    photoCollectionsMap[photoId].push({ photo_id: photoId, collection_id: collId, display_order: nextOrder });
    showToast('Added to collection', 'success');
    renderCollectionsList();
    renderPhotoList(); // refresh chips
  } catch (err) {
    if (err.message.includes('duplicate') || err.message.includes('unique')) {
      showToast('Already in this collection', 'error');
    } else {
      showToast('Error: ' + err.message, 'error');
    }
  }
}

async function removeFromCollection(collId, photoId) {
  try {
    await sbFetch(`/rest/v1/photo_collections?photo_id=eq.${photoId}&collection_id=eq.${collId}`,
      { method: 'DELETE' });
    if (photoCollectionsMap[photoId])
      photoCollectionsMap[photoId] = photoCollectionsMap[photoId].filter(m => m.collection_id !== collId);
    showToast('Removed from collection', 'success');
    renderCollectionsList();
    renderPhotoList();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function moveInCollection(collId, photoId, direction) {
  const members = Object.entries(photoCollectionsMap)
    .filter(([, memberships]) => memberships.some(m => m.collection_id === collId))
    .map(([pid, memberships]) => {
      const m = memberships.find(m => m.collection_id === collId);
      return { photoId: pid, order: m.display_order };
    })
    .sort((a, b) => a.order - b.order);

  const idx = members.findIndex(m => m.photoId === photoId);
  const swapIdx = idx + direction;
  if (swapIdx < 0 || swapIdx >= members.length) return;

  const a = members[idx], b = members[swapIdx];
  try {
    await Promise.all([
      sbFetch(`/rest/v1/photo_collections?photo_id=eq.${a.photoId}&collection_id=eq.${collId}`,
        { method: 'PATCH', body: JSON.stringify({ display_order: b.order }) }),
      sbFetch(`/rest/v1/photo_collections?photo_id=eq.${b.photoId}&collection_id=eq.${collId}`,
        { method: 'PATCH', body: JSON.stringify({ display_order: a.order }) })
    ]);
    // Update local map
    const updateOrder = (pid, newOrder) => {
      const m = (photoCollectionsMap[pid] || []).find(m => m.collection_id === collId);
      if (m) m.display_order = newOrder;
    };
    updateOrder(a.photoId, b.order);
    updateOrder(b.photoId, a.order);
    renderCollectionsList();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function saveCollection(id) {
  const btn = document.querySelector(`#collcard-${id} .btn-save`);
  btn.classList.add('saving'); btn.textContent = 'Saving...';
  try {
    await sbFetch(`/rest/v1/collections?id=eq.${id}`, {
      method: 'PATCH',
      body: JSON.stringify({
        label: document.getElementById(`clabel-${id}`).value.trim(),
        slug:  document.getElementById(`cslug-${id}`).value.trim()
      })
    });
    await loadCollections();
    showToast('Saved', 'success');
    renderCollectionsList();
    btn.classList.remove('saving'); btn.textContent = 'Save Collection';
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
    btn.classList.remove('saving'); btn.textContent = 'Save Collection';
  }
}

async function deleteCollection(id) {
  if (!confirm('Delete this collection? Photos will not be deleted, only removed from this collection.')) return;
  try {
    await sbFetch(`/rest/v1/collections?id=eq.${id}`, { method: 'DELETE' });
    showToast('Collection deleted', 'success');
    await loadCollections();
    renderCollectionsList();
    renderPhotoList();
  } catch (err) { showToast('Error: ' + err.message, 'error'); }
}

async function createCollection() {
  const label = document.getElementById('nc-label').value.trim();
  const slug  = document.getElementById('nc-slug').value.trim()
    || label.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  if (!label) { showToast('Label is required', 'error'); return; }
  try {
    const order = collections.length ? Math.max(...collections.map(c => c.display_order)) + 1 : 1;
    await sbFetch('/rest/v1/collections', {
      method: 'POST',
      body: JSON.stringify({ label, slug, display_order: order })
    });
    showToast('Collection created', 'success');
    closeNewCollectionPanel();
    await loadCollections();
    renderCollectionsList();
  } catch (err) {
    if (err.message.includes('unique')) showToast('A collection with this slug already exists', 'error');
    else showToast('Error: ' + err.message, 'error');
  }
}

function openNewCollectionPanel() {
  document.getElementById('new-collection-panel').classList.add('visible');
  document.getElementById('nc-label').focus();
  // Auto-generate slug from label as jnb types
  document.getElementById('nc-label').oninput = function() {
    document.getElementById('nc-slug').value =
      this.value.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  };
}
function closeNewCollectionPanel() {
  document.getElementById('new-collection-panel').classList.remove('visible');
  document.getElementById('nc-label').value = '';
  document.getElementById('nc-slug').value = '';
}



/* =====================================================
   TOAST
   ===================================================== */
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}
