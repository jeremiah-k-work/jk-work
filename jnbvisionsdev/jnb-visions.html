<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jnb visions</title>
    <style>
        @font-face {
            font-family: 'Archivo';
            src: url('fonts/Archivo-VariableFont_wdth,wght.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Unbounded';
            src: url('fonts/Unbounded-Variable.ttf') format('truetype');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #c8001e;
            --black: #000;
            --white: #fff;
            --gray-outline: rgba(160, 160, 160, 0.65);
            --card-w: min(300px, 72vw);
            --card-h: calc(var(--card-w) * 1.32);
            /* Gallery width capped so outline never leaves the viewport.
       90vw felt large; 82vw gives breathing room on all window sizes. */
            --gallery-w: min(480px, 82vw);
            --gallery-h: calc(var(--gallery-w) * 1.28);
            /* Outline gap: 4vh per side (was 3.5vh offset + 7vh total).
       Stored as a single variable so frame, rect, and border-radius
       all stay in sync from one place. */
            --outline-gap: 4vh;
            --expanded-w: min(800px, 92vw);
            --expanded-h: calc(var(--expanded-w) * 0.78);
            --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --font-primary: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-secondary: 'Unbounded', 'Helvetica Neue', Helvetica, sans-serif;
            /* How far the GALLERY word rises toward the top in gallery state.
       Negative = upward. Adjust this one value to reposition the word. */
            --nav-gallery-rise: -88vh;
            /* Gallery nav: how far from bottom the nav's bottom edge should sit.
       Increase to move the nav higher up the screen. */
            --nav-gallery-bottom-margin: 8vh;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: var(--black);
            overflow: hidden;
            font-family: var(--font-primary);
            color: var(--white);
            cursor: none;
            user-select: none;
            /*border: 4px solid rgba(128, 0, 128, 0.49);*/
        }

        /* Propagate cursor:none everywhere so no system cursor leaks on buttons etc. */
        * {
            cursor: none !important;
        }

        /* ===== CUSTOM CURSOR ===== */
        /* Cursor core — snaps exactly to pointer */
        #cursor-core {
            position: fixed;
            top: 0;
            left: 0;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #ffffff;
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* Positioner — carries the orbiter to the right place via translate.
     Zero size so it doesn't affect layout. */
        #cursor-orbiter-pos {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 9999;
            will-change: transform;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* Orbiter — centred on the positioner point via negative margin.
     Scale animates from its own centre, not the viewport origin. */
        #cursor-orbiter {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            /* Pull back by half own size so it centres on the positioner point */
            top: -7px;
            left: -7px;
            transform-origin: center center;
            transition: width 0.15s ease, height 0.15s ease,
                top 0.15s ease, left 0.15s ease,
                border-color 0.15s ease;
        }

        /* Left-click: orbiter shrinks and moves inward, springs back on release */
        #cursor-orbiter.pressed-left {
            width: 9px;
            height: 9px;
            top: -4.5px;
            left: -4.5px;
            border-color: rgba(255, 255, 255, 0.4);
        }

        #cursor-orbiter.springing {
            animation: orbiterSpring 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes orbiterSpring {
            0% {
                transform: scale(1);
            }

            30% {
                transform: scale(1.9);
            }

            62% {
                transform: scale(0.88);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Right-click: orbiter shrinks in place */
        #cursor-orbiter.pressed-right {
            width: 8px;
            height: 8px;
            top: -4px;
            left: -4px;
            border-color: rgba(255, 255, 255, 0.6);
        }

        /* Inner fill circle — child of orbiter, grows to fill on right-click */
        #cursor-orbiter-fill {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: #ffffff;
            transform: scale(0);
            transform-origin: center center;
            transition: transform 0.18s cubic-bezier(0.34, 1.2, 0.64, 1);
        }

        #cursor-orbiter.pressed-right #cursor-orbiter-fill {
            transform: scale(1);
        }

        /* ===== RED LINE SVG ===== */
        #red-line {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #red-line.hidden {
            opacity: 0;
        }

        /* ===== INTRO SCENE ===== */
        #intro-scene {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Gap compresses tightly on small windows */
            gap: clamp(16px, 4vw, 60px);
            /* Padding so nothing ever touches the edge */
            padding: 0 clamp(12px, 3vw, 40px);
            z-index: 1;
            opacity: 1;
            transition: opacity 0.5s ease;
        }

        #intro-scene.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Left column: VISIONS label */
        #visions-label {
            position: fixed;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            font-family: var(--font-secondary);
            font-size: clamp(8px, 1vw, 11px);
            font-weight: 400;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--red);
            line-height: 1;
            pointer-events: none;
            z-index: 1;
            /* left/top set by JS — transitions with opacity for smooth enter/exit */
            transition: opacity 0.5s ease, left 0.75s var(--ease-expo);
        }

        @media (max-width: 480px) {
            #visions-label {
                display: none;
            }
        }

        /* Centre column: the card */
        /* ===== UNIFIED FRAME =====
     Intro:   position:relative, flex child, card dimensions.
     Gallery: position:fixed, centred, gallery dimensions.
     CRITICAL: no z-index on any child — stacking is document order only.
     This keeps overflow:hidden clipping intact when position:fixed is applied,
     because no child is promoted to its own compositor layer.
  */
        /* ===== INTRO SPACER =====
     Invisible placeholder in intro-scene that reserves the space
     the frame visually occupies, keeping label and nav correctly flanking it. */
        #intro-spacer {
            width: min(var(--card-w), 55vw);
            height: calc(min(var(--card-w), 55vw) * 1.32);
            flex-shrink: 1;
            pointer-events: none;
        }

        /* unified-frame: handles size and position only.
     No overflow, no border-radius — those live on #frame-inner.
     z-index only applied when detached (gallery state) so gallery-tap
     sits above gallery chrome elements that would otherwise intercept clicks. */
        #unified-frame {
            /* Always fixed — body child, never inherits pointer-events from intro-scene.
       In intro: JS positions it over the spacer.
       In gallery (detached): JS centres it at 50%/50%. */
            position: fixed;
            z-index: 15;
            transition:
                width 0.75s var(--ease-expo),
                height 0.75s var(--ease-expo),
                top 0.75s var(--ease-expo),
                left 0.75s var(--ease-expo),
                transform 0.75s var(--ease-expo);
        }

        /* frame-inner: always position:relative, always the same positioning model.
     Carries overflow:hidden and border-radius — these never break in Safari
     because this element is never promoted or repositioned. */
        #frame-inner {
            position: absolute;
            inset: 0;
            border-radius: 22px;
            overflow: hidden;
            transition: border-radius 0.75s var(--ease-expo);
        }

        /* Gallery border-radius applied when frame expands */
        #unified-frame.detached #frame-inner {
            border-radius: 12vh;
        }

        /* Children — no z-index, no will-change. Document order = paint order. */

        #intro-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
            /* No opaque background — prevents WebKit compositing bug where a solid
       background on a child of overflow:hidden + border-radius bleeds outside
       the rounded clip. The red overlay covers any gap during loading. */
        }

        /* Dark plate — covers intro-photo during gallery session.
     Fades in on enter, fades out on exit.
     Also provides a clean dark base when gallery-photo fades between slides. */
        #photo-plate {
            position: absolute;
            inset: 0;
            background: #000;
            opacity: 0;
            /* 1px border-radius forces WebKit to respect the overflow:hidden clip
       on the parent — same compositing quirk as intro-photo. */
            border-radius: 1px;
            transition: opacity 0.65s cubic-bezier(0.7, 0, 0.15, 1);
        }

        #photo-plate.visible {
            opacity: 1;
        }

        #gallery-photo {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            background: transparent;
            opacity: 0;
            image-rendering: pixelated;
            transition: opacity 0.55s ease,
                object-position 0.75s var(--ease-expo);
        }

        #gallery-photo.loaded {
            opacity: 1;
        }

        #intro-overlay {
            position: absolute;
            inset: 0;
            background: var(--red);
            mix-blend-mode: difference;
            /* Slow cinematic lift — ease-in so it lingers at full opacity
       before gradually fading, giving a sense of the curtain rising. */
            transition: opacity 1.4s cubic-bezier(0.4, 0, 0.6, 1);
            pointer-events: none;
        }

        #intro-overlay.lifted {
            opacity: 0;
        }



        #gallery-tap {
            position: absolute;
            inset: 0;
            display: none;
        }

        #gallery-tap.active {
            display: block;
        }

        /* ===== UNIFIED NAV =====
     Single fixed container, always in the DOM.
     Intro: JS positions left edge flush with frame right edge.
     Gallery: bottom-centre, width clamped to visible children only.

     The Gallery word grows large in gallery state but must NOT
     influence the container width — it overflows visually while
     contributing zero layout width via width:0 + overflow:visible.
     This keeps the container centring correct. */

        #nav-unified {
            position: fixed;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: clamp(10px, 2vh, 18px);
            z-index: 20;
            overflow: visible;
            /* border: 2px solid indigo; */
            /* Transition left and transform only.
       top/bottom are NOT transitioned — they snap via JS inline styles
       to avoid the top↔bottom interpolation problem on return. */
            transition:
                left 0.75s var(--ease-expo),
                transform 0.75s var(--ease-expo);
        }

        /* Suppress ALL transitions when snapping back to intro position */
        #nav-unified.no-transition {
            transition: none !important;
        }

        /* Gallery state: horizontal centering at bottom */
        #nav-unified.gallery {
            left: 50% !important;
            right: auto !important;
            transform: translateX(-50%) !important;
            align-items: center;
            pointer-events: none;
        }

        #nav-unified.gallery .nav-word {
            pointer-events: all;
        }

        /* Booking state: left side, vertically centered */
        #nav-unified.booking {
            left: 32px !important;
            right: auto !important;
            top: 50% !important;
            bottom: auto !important;
            transform: translateY(-50%) !important;
            align-items: flex-start;
            pointer-events: none;
            text-align: center;
            overflow: visible;
        }

        #nav-unified.booking .nav-word {
            pointer-events: all;
        }

        /* Base word */
        .nav-word {
            background: transparent;
            border: none;
            font-family: var(--font-secondary);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            line-height: 1;
            white-space: nowrap;
            position: relative;
            padding: 0;
            transition:
                font-size 0.75s var(--ease-expo),
                color 0.25s ease,
                opacity 0.75s var(--ease-expo),
                transform 0.75s var(--ease-expo),
                letter-spacing 0.75s var(--ease-expo);
        }

        .nav-word::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 1px;
            background: currentColor;
            transition: width 0.22s var(--ease-expo);
        }

        .nav-word:hover::after {
            width: 100%;
        }

        /* ── GALLERY word ──
     Intro: normal size, in flow.
     Gallery: zero layout width so it cannot affect container centring.
     The word overflows visually. translateX(-50%) centres it on the
     container's centreline regardless of the word's own rendered width.
     translateY lifts it to the top of the screen. */
        #nav-gallery {
            font-size: clamp(10px, 1.4vw, 14px);
            font-weight: 700;
            color: var(--white);
            opacity: 1;
            width: auto;
            transform: none;
        }

        #nav-unified.gallery #nav-gallery {
            width: 100vw;
            font-size: clamp(48px, 18vw, 120px);
            letter-spacing: 0.05em;
            color: var(--white);
            opacity: 0.045;
            pointer-events: none;
            transform: translateY(var(--nav-gallery-rise));
        }

        #nav-unified.booking #nav-gallery {
            opacity: 0;
            pointer-events: none;
        }

        /* Centre the overflowing Gallery word on the container centreline */
        #nav-unified.gallery {
            text-align: center;
        }

        /* ── SHOWCASE word ── */
        #nav-showcase {
            font-size: clamp(10px, 1.4vw, 14px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            opacity: 1;
            transform: none;
        }
        #nav-showcase:hover { color: rgba(255, 255, 255, 0.85); }

        /* ── CONNECT (Book) word ── */
        #nav-connect {
            font-size: clamp(10px, 1.4vw, 14px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.45);
            opacity: 1;
            transform: none;
        }

        #nav-unified.gallery #nav-connect {
            font-size: clamp(9px, 1.1vw, 12px);
            color: rgba(255, 255, 255, 0.38);
        }

        #nav-connect:hover {
            color: rgba(255, 255, 255, 0.85);
        }

        /* ── BACK word ── */
        #nav-back {
            font-family: var(--font-primary);
            font-size: clamp(10px, 1.4vw, 14px);
            font-weight: 400;
            color: rgba(255, 255, 255, 0.38);
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        #nav-unified.gallery #nav-back,
        #nav-unified.booking #nav-back {
            opacity: 1;
            transform: translateY(0);
            pointer-events: all;
        }
        /* Showcase button hidden in gallery-sheet and booking */
        #nav-unified.gallery #nav-showcase,
        #nav-unified.booking #nav-showcase {
            opacity: 0;
            pointer-events: none;
        }

        /* Hide Showcase and Gallery in non-intro states */
        #nav-unified.gallery #nav-showcase,
        #nav-unified.booking #nav-showcase {
            opacity: 0;
            pointer-events: none;
        }
        #nav-unified.gallery-sheet #nav-gallery,
        #nav-unified.booking #nav-gallery {
            opacity: 0;
            pointer-events: none;
        }

        /* Hide Book button when already in booking view */
        /* BOOK word becomes the ambient heading in booking state —
           mirrors exactly how GALLERY behaves in gallery state */
        #nav-unified.booking #nav-connect {
            width: 100vw;
            font-size: clamp(48px, 18vw, 120px);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--white);
            opacity: 0.045;
            pointer-events: none;
            transform: translateY(var(--nav-gallery-rise));
            overflow: visible;
        }

        #nav-back:hover {
            color: rgba(255, 255, 255, 0.85);
        }

        /* ===== OUTLINE RECT =====
     Fixed, positioned and sized by JS to wrap unified-frame.
     Hidden in intro, fades in during morph. */
        #outline-rect {
            position: fixed;
            border: 2px solid var(--gray-outline);
            border-radius: calc(12vh + var(--outline-gap));
            pointer-events: none;
            z-index: 2;
            opacity: 0;
            transition:
                opacity 0.5s ease,
                width 0.75s var(--ease-expo),
                height 0.75s var(--ease-expo),
                top 0.75s var(--ease-expo),
                left 0.75s var(--ease-expo),
                border-radius 0.75s var(--ease-expo);
        }

        #outline-rect.rect-visible {
            opacity: 1;
        }

        /* ===== UNIFIED LOGO =====
     Single fixed element. JS positions it in all states:
     intro: centred over the frame card
     gallery: offset to the left edge of the gallery photo
     expanded: centred below the photo
     Transitions continuously — no swap, no opacity toggle. */
        #logo {
            position: fixed;
            pointer-events: none;
            z-index: 17;
            transition:
                left 0.75s var(--ease-expo),
                top 0.75s var(--ease-expo),
                width 0.75s var(--ease-expo),
                transform 0.75s var(--ease-expo),
                opacity 0.5s ease;
        }

        #logo img {
            width: 100%;
            display: block;
        }

        /* ===== INFO PANEL ===== */
        #info-panel {
            position: fixed;
            right: -300px;
            opacity: 0;
            pointer-events: none;
            transition: right 0.7s var(--ease-expo), opacity 0.4s ease,
                top 0.7s var(--ease-expo);
            z-index: 16;
            text-align: right;
        }

        #info-panel.visible {
            opacity: 1;
        }

        .info-name-first {
            font-family: var(--font-secondary);
            font-size: clamp(10px, 2.2vw, 34px);
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
            color: var(--white);
            margin: 0px 8px;
        }

        .info-name-last {
            font-family: var(--font-secondary);
            display: inline-block;
            background: var(--white);
            color: var(--black);
            font-size: clamp(10px, 2.2vw, 34px);
            font-weight: 300;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0px 40px 0px 8px;
            line-height: 1.4;
            margin-top: 5px;
        }

        /* ===== WATERMARKS ===== */
        #watermark-left,
        #watermark-right {
            position: fixed;
            top: 0;
            bottom: 0;
            writing-mode: vertical-rl;
            font-family: var(--font-secondary);
            font-size: 9px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: rgba(180, 0, 0, 0.55);
            font-weight: 600;
            pointer-events: none;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 1;
        }

        #watermark-left {
            left: 8px;
        }

        #watermark-right {
            right: 8px;
            transform: rotate(180deg);
        }

        #watermark-left.visible,
        #watermark-right.visible {
            opacity: 1;
        }

        /* ===== NAV ===== */
        #nav-prev,
        #nav-next {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-family: var(--font-secondary);
            font-size: 9px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, color 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            z-index: 5;
        }

        #nav-prev {
            left: 24px;
        }

        #nav-next {
            right: 24px;
        }

        #nav-prev.visible,
        #nav-next.visible {
            opacity: 1;
            pointer-events: all;
        }

        #nav-prev:hover,
        #nav-next:hover {
            color: rgba(255, 255, 255, 0.8);
        }

        .nav-line {
            width: 1px;
            height: 40px;
            background: currentColor;
            display: block;
        }



        /* ===== KEYBOARD HINT ===== */
        #kbd-hint {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-family: var(--font-secondary);
            font-size: 7px;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.12);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            white-space: nowrap;
        }

        #kbd-hint.visible {
            opacity: 1;
        }

        /* ===== FADE UTILITY ===== */
        .fade-in {
            animation: fadeIn 0.45s ease both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* ===== RED LINE IDLE ANIMATION ===== */
        #red-line-group {
            animation: redLineIdle 8s ease-in-out infinite;
            transform-origin: 500px 300px;
            /* SVG centre — same as the rotate pivot */
            transform-box: fill-box;
        }

        @keyframes redLineIdle {
            0% {
                transform: rotate(-15deg) translate(0px, 0px);
            }

            25% {
                transform: rotate(-15deg) translate(6px, -4px);
            }

            50% {
                transform: rotate(-15deg) translate(0px, -8px);
            }

            75% {
                transform: rotate(-15deg) translate(-6px, -4px);
            }

            100% {
                transform: rotate(-15deg) translate(0px, 0px);
            }
        }


        /* =====================================================
     SITE SLIDER
     The slider is viewport-sized with overflow hidden.
     Sheet-1 and booking-scene sit side by side inside it
     via absolute positioning. The slider itself never
     overflows, so fixed-position children are unaffected.
     ===================================================== */
        #site-slider {
            position: relative;
            width: 100vw;
            min-height: 100vh;
            overflow: hidden;
        }

        #sheet-1 {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            min-height: 100vh;
            transition: transform 0.75s var(--ease-expo);
            will-change: transform;
            
            /* border: 2px solid yellow; */
        }

        #sheet-1.slide-out {
            transform: translateX(-100vw);
        }

        /* =====================================================
     BOOKING SCENE
     ===================================================== */
        /* ── Gallery Scene — Sheet 0, left of intro ── */
        #gallery-scene {
            position: absolute;
            top: 0;
            left: -100vw;
            width: 100vw;
            min-height: 100vh;
            overflow-y: auto;
            transition: transform 0.75s var(--ease-expo);
            will-change: transform;
            display: flex;
            flex-direction: column;
        }
        #gallery-scene.slide-in {

        @property --shimmer-angle {
            syntax: '<angle>';
            inherits: false;
            initial-value: 0deg;
        }

        @keyframes shimmer-rotate {
            to { --shimmer-angle: 360deg; }
        }

        /* Ambient glow — blurred conic, sits above the photo */
        .gallery-slot::before {
            content: '';
            position: absolute;
            inset: -40%;
            z-index: 4;
            background: conic-gradient(
                from var(--shimmer-angle, 0deg),
                transparent 0deg,
                rgba(180,185,215,0.0) 70deg,
                rgba(200,205,230,0.35) 90deg,
                rgba(240,240,255,0.55) 100deg,
                rgba(200,205,230,0.35) 110deg,
                rgba(180,185,215,0.0) 130deg,
                transparent 180deg,
                transparent 360deg
            );
            opacity: 0;
            filter: blur(80px);
            transition: opacity 0.8s ease;
            pointer-events: none;
            border-radius: 50%;
        }
        .gallery-slot:hover::before {
            opacity: 1;
            animation: shimmer-rotate 8s linear infinite;
        }

        /* Shimmer ring — sits above the photo as a border-like overlay.
           Uses the border-image trick: the element covers the slot exactly,
           a transparent background reveals the photo, and the border itself
           carries the rotating conic gradient. overflow:hidden on the parent
           clips it to the border-radius. */
        .gallery-slot::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 2;
            border-radius: inherit;
            /* Rotating conic gradient as the border */
            border: 1px solid transparent;
            background:
                /* transparent fill so photo shows through */
                linear-gradient(#000 0 0) padding-box,
                /* rotating silver arc as the border paint */
                conic-gradient(
                    from var(--shimmer-angle, 0deg),
                    transparent 0deg,
                    transparent 55deg,
                    rgba(150,155,170,0.0) 75deg,
                    rgba(200,205,220,0.6) 88deg,
                    rgba(240,242,250,1.0) 95deg,
                    rgba(200,205,220,0.6) 102deg,
                    rgba(150,155,170,0.0) 115deg,
                    transparent 135deg,
                    transparent 360deg
                ) border-box;
            /* Cut out the padding-box fill so only the border is painted */
            -webkit-mask:
                linear-gradient(#fff 0 0) padding-box,
                linear-gradient(#fff 0 0) border-box;
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }
        .gallery-slot:hover::after {
            opacity: 1;
            animation: shimmer-rotate 8s linear infinite;
        }

            font-size: clamp(11px, 1.4vw, 14px);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
        }

        .booking-label {
            display: block;
            font-family: var(--font-secondary);

            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 6px;

            flex-direction: column;

<body>

    <!-- SITE SLIDER — horizontal slide container.
     Sheet 1 (intro/gallery) is the normal body content.
     Sheet 2 (booking) slides in from the right.
     transform: translateX(-100vw) shows Sheet 2. -->
    <div id="site-slider">

        <!-- GALLERY SCENE — Sheet 0, slides in from the left -->
        <div id="gallery-scene" style="display:none"></div>

        <div id="sheet-1">

            <!-- RED LINE -->
            <svg id="red-line" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
                <!--
    Path extended well beyond the viewBox so ends are never visible
    at any window proportion. preserveAspectRatio="xMidYMid slice"
    ensures the SVG fills the viewport rather than letterboxing.
    The group rotation of -15deg matches the original design.
    A slow CSS animation gently undulates the path via a secondary
    translate on the group, giving an idle breathing quality.
  -->
                <g transform="rotate(-15, 504, 300)" id="red-line-group">
                    <path id="red-line-path" d="M -400,450 L 480,450 Q 740,450 740,190 L 740,-200" fill="none" stroke="#c8001e" stroke-width="2" stroke-linecap="round" />
                </g>
            </svg>

            <!-- UNIFIED FRAME — direct child of body, never inside intro-scene.
     Isolated from any pointer-events:none on parent elements.
     In intro: positioned by JS to overlap the spacer in intro-scene.
     In gallery: centred via translate(-50%,-50%). -->
            <div id="unified-frame">
                <div id="frame-inner">
                    <img id="intro-photo" src="images/9N2A2754--e1-Vibrant.jpg" alt="Artist portrait">
                    <!-- Dark plate sits between intro-photo and gallery-photo.
         Fades in when entering gallery (covers jnb),
         fades out when exiting (reveals jnb under overlay). -->
                    <div id="photo-plate"></div>
                    <img id="gallery-photo" alt="">
                    <div id="intro-overlay"></div>
                </div>
                <div id="gallery-tap" onclick="toggleExpanded()"></div>
            </div>

            <!-- INTRO SCENE — spacer only; label and nav are fixed elements -->
            <div id="intro-scene">
                <!-- Spacer holds the space the frame visually occupies,
       keeping intro-scene the right width for JS measurements -->
                <div id="intro-spacer"></div>
            </div>

            <!-- VISIONS LABEL — fixed, positioned by JS left of the frame -->
            <div id="visions-label">Visions</div>

            <!-- OUTLINE RECT — fixed, positioned by JS to wrap unified-frame -->
            <div id="outline-rect"></div>
            
            <!-- INFO PANEL -->
            <div id="info-panel">
                <div class="info-name-first" id="info-first"></div>
                <div class="info-name-last" id="info-last"></div>
            </div>

            <!-- WATERMARKS -->
            <div id="watermark-left">Visions Visions Visions Visions Visions Visions Visions Visions Visions Visions</div>
            <div id="watermark-right">Visions Visions Visions Visions Visions Visions Visions Visions Visions Visions</div>

            <!-- NAV -->
            <button id="nav-prev" onclick="navigate(-1)">
                <span class="nav-line"></span>
                <span>Prev</span>
            </button>
            <button id="nav-next" onclick="navigate(1)">
                <span>Next</span>
                <span class="nav-line"></span>
            </button>



            <!-- KEYBOARD HINT -->
            <div id="kbd-hint">&#8592; &nbsp; Arrow keys to navigate &nbsp; &#8594;</div>

        </div><!-- end sheet-1 -->

        <!-- BOOKING SCENE — Sheet 2, slides in from right -->
        <div id="booking-scene" style="display:none">
        </div>



    </div><!-- end site-slider -->

    <!-- UNIFIED NAV — direct body child, position:fixed, never inside
     any transforming container so it's always viewport-anchored. -->
    <nav id="nav-unified">
        <button id="nav-gallery"  class="nav-word" onclick="enterGallerySheet()">Gallery</button>
        <button id="nav-showcase" class="nav-word" onclick="enterShowcase()">Showcase</button>
        <button id="nav-connect"  class="nav-word" onclick="goBook()">Book</button>
        <button id="nav-back"     class="nav-word" onclick="goBackGeneric()">Back</button>
    </nav>
    
    <div id="logo">
        <img id="logo-img" alt="jnb visions">
    </div>

    <!-- CUSTOM CURSOR -->
    <div id="cursor-core"></div>
    <div id="cursor-orbiter-pos">
        <div id="cursor-orbiter">
            <div id="cursor-orbiter-fill"></div>
        </div>
    </div>

    <script>
        /* =====================================================
   CONFIGURATION
   =====================================================

   LOGO: single source of truth. Change this filename
   and both logo placements update automatically.

   GALLERY entries:
     src:        image filename (same folder as this HTML)
     first:      subject first name — Unbounded, uppercase, white
     last:       subject last name — Unbounded, white pill
     logoY:      logo vertical position as % of image height (0=top, 100=bottom)
     infoY:      info panel vertical position as % of viewport height
     zoomAnchor: [x, y] — the point in the photo the frame zooms toward when
                 expanded. Both values are percentages: [0,0] = top-left,
                 [100,100] = bottom-right, [50,50] = dead center.
                 Example: [60, 25] pulls toward the upper-right of the frame,
                 useful when a subject's face sits in that region.
                 Omit (or set to [50,50]) to zoom into the center.
*/

        /* =====================================================
           PATHS — update here if folder structure changes
           ===================================================== */
        const PATHS = {
            images: 'images/', // trailing slash required
            logo: 'jnb-2026_sq.svg'
        };

        const LOGO = PATHS.logo;

        /* Logo width in each state (px).
           Change these to resize the logo across all positions at once. */
        const LOGO_SIZES = {
            intro: 120, // centred over the intro card
            gallery: 120, // overlapping left edge of gallery photo
            expanded: 160 // centred below the expanded photo
        };

        /* =====================================================
           SUPABASE CONFIG
           ===================================================== */
        const SUPABASE_URL = 'https://xzhiblzvgeqtlicbstzu.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6aGlibHp2Z2VxdGxpY2JzdHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDE2MjksImV4cCI6MjA5NTgxNzYyOX0.QZiINBDncHEKUUDTFG2H9RH1R_QSI9hH-B5vkFT5sBM';


        /* Fallback used if Supabase is unreachable */
        const SHOWCASE_FALLBACK = {
            showcase: [{
                    src: 'images/CA5D6891_CA_L_no-logo.jpg',
                    first: 'Freddie',
                    last: 'Andrews',
                    logoY: 50,
                    infoY: 70,
                    zoomAnchor: [60, 14],
                    zoomRatio: 0.65
                },
                {
                    src: 'images/CA5D6948.jpg',
                    first: 'Rebecca',
                    last: 'Deboer',
                    logoY: 44,
                    infoY: 68,
                    zoomAnchor: [60, 30],
                    zoomRatio: 0.65
                },
                {
                    src: 'images/CA5D6942_S_CA_.jpg',
                    first: 'Rebecca',
                    last: 'Deboer',
                    logoY: 64,
                    infoY: 44,
                    zoomAnchor: [70, 78],
                    zoomRatio: 0.65
                }
            ]
        };

        /* GALLERY is populated by fetchGallery() on load */
        let GALLERY = SHOWCASE_FALLBACK;

        async function fetchGallery() {
            try {
                // Query photo_collections joined to photos (published only) and
                // their subject credits, ordered by display_order in the collection.
                // Supabase nested select syntax pulls related rows in one request.
                const params = new URLSearchParams({
                    select: [
                        'display_order',
                        'photos!inner(id,src,logo_y,info_y,zoom_anchor_x,zoom_anchor_y,zoom_ratio,published)',
                        'collections!inner(slug)'
                    ].join(','),
                    'collections.slug': 'eq.portraits', // fallback; mount overrides at runtime
                    'photos.published': 'eq.true',
                    order: 'display_order.asc'
                });

                const res = await fetch(
                    `${SUPABASE_URL}/rest/v1/photo_collections?${params}`, {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': `Bearer ${SUPABASE_KEY}`
                        }
                    }
                );
                if (!res.ok) throw new Error('Supabase fetch failed');
                const rows = await res.json();

                // For each photo, fetch its subject credits separately
                // (Supabase free tier doesn't support deep nested joins via REST easily)
                const photoIds = rows.map(r => r.photos.id);
                let credits = [];
                if (photoIds.length) {
                    const credParams = new URLSearchParams({
                        select: 'photo_id,role,people(first_name,last_name)',
                        'photo_id': `in.(${photoIds.join(',')})`,
                        role: 'eq.subject'
                    });
                    const credRes = await fetch(
                        `${SUPABASE_URL}/rest/v1/photo_credits?${credParams}`, {
                            headers: {
                                'apikey': SUPABASE_KEY,
                                'Authorization': `Bearer ${SUPABASE_KEY}`
                            }
                        }
                    );
                    if (credRes.ok) credits = await credRes.json();
                }

                // Build a map of photo_id -> first subject found
                const subjectMap = {};
                credits.forEach(c => {
                    if (!subjectMap[c.photo_id] && c.people) {
                        subjectMap[c.photo_id] = c.people;
                    }
                });

                const portraits = rows.map(r => {
                    const p = r.photos;
                    const subject = subjectMap[p.id] || {};
                    return {
                        src: PATHS.images + p.src,
                        first: subject.first_name || '',
                        last: subject.last_name || '',
                        logoY: p.logo_y,
                        infoY: p.info_y,
                        zoomAnchor: [p.zoom_anchor_x, p.zoom_anchor_y],
                        zoomRatio: p.zoom_ratio
                    };
                });

                GALLERY = { showcase: portraits };
            } catch (err) {
                console.warn('[jnb] Supabase unavailable, using fallback gallery:', err.message);
                GALLERY = GALLERY_FALLBACK;
            }
        }

        /* =====================================================
           BOOT
           ===================================================== */
        document.getElementById('logo-img').src = LOGO;

        // Fetch gallery and mount data at load
        fetchGallery();
        fetchMounts().then(applyMounts);

        /* =====================================================
           STATE
           ===================================================== */
        let state = 'intro'; // current state: 'intro'|'gallery'|'expanded'|'booking'|'gallery-sheet'
        let navHistory = ['intro']; // sheet navigation stack — Back pops this
        let bookingPrevState = 'intro'; // kept for exitBook compat
        let isExiting = false; // true while exitGallery transition is running

        function navPush(s) {
            // Push a new state onto history
            navHistory.push(s);
            state = s;
        }
        function navPop() {
            // Pop current state and return the previous one
            if (navHistory.length > 1) navHistory.pop();
            return navHistory[navHistory.length - 1];
        }
        function navPeek() {
            return navHistory[navHistory.length - 1];
        }

        function applyMounts() {
            // Apply intro portrait mount
            const introSrc = getMountPhoto('intro-portrait');
            if (introSrc) {
                const introPhoto = document.getElementById('intro-photo');
                if (introPhoto) introPhoto.src = introSrc;
            }

            // Wire showcase mount into GALLERY so enterGallery fallback is current
            const showcasePhotos = siteMount['showcase'] || [];
            if (showcasePhotos.length) {
                GALLERY['showcase'] = showcasePhotos.map(src => ({
                    src: PATHS.images + src,
                    first: '', last: '',
                    logoY: 80, infoY: 55,
                    zoomAnchor: [50, 50],
                    zoomRatio: 0.65
                }));
            }
            // Booking card backgrounds applied when renderBookingView runs
        }
        let currentCollection = [];
        let currentIndex = 0;
        let isExpanded = false;

        /* =====================================================
           GALLERY SHEET
           ===================================================== */

        let galleryCollections   = [];  // gallery-type collections from Supabase
        let galleryPhotos        = [];  // photos in current collection
        let galleryCurrentColl   = null; // { id, label, slug }
        let galleryPhotoIndex    = 0;   // index in galleryPhotos for isolated view
        let galleryBookingContext = null; // { source, slug } — passed to booking
        const collectionCoverCache = new Map(); // collectionId → { src, ax, ay, count }
        const collectionPhotosCache = new Map(); // collectionId → photos array
        const collectionGridCache   = new Map(); // collectionId → rendered grid HTML

        /* ── Enter / Exit ── */

        async function enterGallerySheet() {
            if (state === 'gallery' || state === 'expanded') exitGallery();
            if (state === 'booking') return; // handled by nav Back

            navPush('gallery-sheet');

            // Fetch collections if not loaded yet
            if (!galleryCollections.length) await fetchGalleryCollections();

            // Show scene
            const scene = document.getElementById('gallery-scene');
            scene.style.display = 'flex';
            renderGalleryLanding();

            // Slide left → right reveal
            requestAnimationFrame(() => requestAnimationFrame(() => {
                document.getElementById('sheet-1').classList.add('slide-right');
                scene.classList.add('slide-in');
            }));

            // Nav: gallery-sheet state (Back visible, Gallery hidden, Showcase hidden)
            setNavState('gallery-sheet');
            document.getElementById('logo').style.opacity = '0';
        }

        function exitGallerySheet() {
            if (state !== 'gallery-sheet') return;
            closeGalleryPhotoView();

            const prevState = navPop(); // pop gallery-sheet, get previous
            state = prevState || 'intro';

            // Start slide back
            document.getElementById('sheet-1').classList.remove('slide-right');
            document.getElementById('gallery-scene').classList.remove('slide-in');

            if (state === 'intro') {
                // Nav: remove gallery class first so the transition can animate
                // from gallery position (left:50%) to intro position.
                // setNavState clears the class and sets inline styles that
                // the CSS transition will carry.
                setNavState('intro');
                // After slide settles, snap nav and logo precisely
                setTimeout(() => {
                    setNavState('intro', true);
                    positionIntroAll();
                    document.getElementById('logo').style.opacity = '1';
                    document.getElementById('logo').style.left = '';  // reset any booking position
                    // Restore unified-frame (may have been hidden if we came via Book)
                    document.getElementById('unified-frame').style.opacity = '1';
                    document.getElementById('outline-rect').classList.add('rect-visible');
                    document.getElementById('gallery-scene').style.display = 'none';
                    galleryCurrentColl = null;
                }, 820);
            } else {
                setNavState('gallery');
                setTimeout(() => {
                    document.getElementById('logo').style.opacity = '1';
                    document.getElementById('gallery-scene').style.display = 'none';
                    galleryCurrentColl = null;
                }, 820);
            }
        }

        /* ── Data fetching ── */

        async function fetchGalleryCollections() {
            try {
                // Fetch only gallery-type collections that have photos
                const rows = await fetch(
                    `${SUPABASE_URL}/rest/v1/collections?select=id,label,slug,collection_type&collection_type=eq.gallery&order=display_order.asc`,
                    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
                ).then(r => r.json());
                galleryCollections = rows || [];
            } catch(err) {
                console.warn('[jnb] Gallery collections fetch failed:', err.message);
                galleryCollections = [];
            }
        }

        async function fetchCollectionPhotos(collectionId) {
            // Return cached result immediately if available
            if (collectionPhotosCache.has(collectionId)) {
                return collectionPhotosCache.get(collectionId);
            }
            try {
                const rows = await fetch(
                    `${SUPABASE_URL}/rest/v1/photo_collections?select=display_order,photos!inner(id,src,published,zoom_anchor_x,zoom_anchor_y)&collection_id=eq.${collectionId}&photos.published=eq.true&order=display_order.asc`,
                    { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
                ).then(r => r.json());
                const photos = (rows || []).map(r => r.photos).filter(p => p?.src);
                collectionPhotosCache.set(collectionId, photos);
                return photos;
            } catch(err) {
                console.warn('[jnb] Collection photos fetch failed:', err.message);
                return [];
            }
        }

        /* ── Landing: collection cards ── */

        function renderGalleryLanding() {
            const scene = document.getElementById('gallery-scene');
            if (!galleryCollections.length) {
                scene.innerHTML = `<div id="gallery-inner">
                    <div class="gallery-heading" style="color:rgba(255,255,255,0.4);margin-top:40px">
                        No collections available yet.
                    </div></div>`;
                return;
            }

            const cardsHtml = galleryCollections.map(c => {
                // Use first photo from siteMount or from photo list as cover
                // For now use a solid background — photo cover loaded lazily
                return `
                <div class="gallery-coll-card" id="gccard-${c.id}"
                     onclick="openCollection('${c.id}','${c.label}','${c.slug}')">
                  <div class="gallery-coll-bg-img" id="gcbg-${c.id}"></div>
                  <div class="gallery-coll-gradient"></div>
                  <div class="gallery-coll-info">
                    <div class="gallery-coll-name">${c.label}</div>
                  </div>
                </div>`;
            }).join('');

            scene.innerHTML = `<div id="gallery-inner">
                <div id="gallery-header">
                    <span class="gallery-heading">Collections</span>
                </div>
                <div id="gallery-collections">${cardsHtml}</div>
            </div>`;

            // Lazily load cover photos for each card
            loadCollectionCovers();
        }

        function applyCoverToCard(collectionId, coverData, delay = 0) {
            // Apply a cached cover. Use rAF + optional delay so the opacity:0
            // initial state has time to register before we transition to opacity:1.
            const bgDiv = document.getElementById(`gcbg-${collectionId}`);
            if (!bgDiv) return;
            bgDiv.style.backgroundImage    = `url('${PATHS.images}${coverData.src}')`;
            bgDiv.style.backgroundPosition = `${coverData.ax}% ${coverData.ay}%`;
            bgDiv.style.backgroundSize     = 'cover';
            bgDiv.style.setProperty('--focal-x', coverData.ax + '%');
            bgDiv.style.setProperty('--focal-y', coverData.ay + '%');
            // Give the browser one frame to register opacity:0 before fading in
            requestAnimationFrame(() => {
                setTimeout(() => bgDiv.classList.add('loaded'), delay);
            });
        }

        async function loadCollectionCovers() {
            const uncached = [];

            // Apply cached covers with a stagger so they fade in sequentially
            let cachedIdx = 0;
            for (const c of galleryCollections) {
                if (collectionCoverCache.has(c.id)) {
                    applyCoverToCard(c.id, collectionCoverCache.get(c.id), cachedIdx * 80);
                    cachedIdx++;
                } else {
                    uncached.push(c);
                }
            }

            // Fetch and fade in uncached covers
            for (const c of uncached) {
                const card = document.getElementById(`gccard-${c.id}`);
                if (!card) continue;

                const photos = await fetchCollectionPhotos(c.id);
                if (!photos.length) continue;

                const cover = photos[0];
                const coverData = {
                    src: cover.src,
                    ax:  cover.zoom_anchor_x ?? 50,
                    ay:  cover.zoom_anchor_y ?? 50,
                    count: photos.length
                };
                collectionCoverCache.set(c.id, coverData);

                const bgDiv = document.getElementById(`gcbg-${c.id}`);
                if (!bgDiv) continue;

                // Use Image() to detect when the browser has loaded the image
                // before fading it in — avoids showing a half-painted background
                const img = new Image();
                img.onload = () => {
                    bgDiv.style.backgroundImage    = `url('${PATHS.images}${coverData.src}')`;
                    bgDiv.style.backgroundPosition = `${coverData.ax}% ${coverData.ay}%`;
                    bgDiv.style.backgroundSize     = 'cover';
                    bgDiv.style.setProperty('--focal-x', coverData.ax + '%');
                    bgDiv.style.setProperty('--focal-y', coverData.ay + '%');
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => bgDiv.classList.add('loaded'));
                    });
                };
                img.src = PATHS.images + coverData.src;

                // Small delay between fetches only when hitting Supabase
                await new Promise(r => setTimeout(r, 60));
            }
        }

        /* ── Collection grid view ── */

        async function openCollection(id, label, slug) {
            galleryCurrentColl = { id, label, slug };
            galleryBookingContext = { source: 'gallery-collection', slug };

            const scene = document.getElementById('gallery-scene');

            // Always render the shell so the header is present
            scene.innerHTML = `<div id="gallery-grid-view">
                <div id="gallery-grid-header">
                    <span class="gallery-grid-breadcrumb"
                          onclick="renderGalleryLanding()">← Collections</span>
                    <span class="gallery-grid-title">${label}</span>
                </div>
                <div id="gallery-chunk-area"></div>
                <div id="gallery-chunk-nav">
                    <button class="gallery-chunk-arrow" data-dir="-1"
                            onclick="advanceChunks(-1)" disabled>←</button>
                    <button class="gallery-chunk-arrow" data-dir="1"
                            onclick="advanceChunks(1)">→</button>
                </div>
            </div>`;

            // If we have a cached grid, restore it — images are already in browser cache
            // so they render instantly without re-downloading
            if (collectionPhotosCache.has(id)) {
                // Photos already fetched — render chunks immediately from cache
                galleryPhotos = collectionPhotosCache.get(id);
                chunkWindowStart = 0;
                renderChunkDisplay();
                return;
            }

            const photos = await fetchCollectionPhotos(id);
            galleryPhotos = photos;
            chunkWindowStart = 0;

            if (!photos.length) {
                document.getElementById('gallery-grid').innerHTML =
                    '<div class="gallery-heading" style="opacity:0.4">No photos in this collection.</div>';
                return;
            }

            renderChunkDisplay();
            // No grid HTML cache needed — chunks are rendered from data + templates
        }

        /* =====================================================
           CHUNK TEMPLATE LAYOUT
           ===================================================== */

        // Photo window — index of first visible photo in the chunk display
        let chunkWindowStart = 0;

        /* ── Template definitions ──────────────────────────────
           Each template is an array of COLUMNS.
           Each column has:
             w: fraction of chunkW (0–1)
             slots: array of { h: fraction of chunkH }
           Photos are assigned left-to-right, top-to-bottom.
           photosNeeded = sum of all slots across all columns.
        ─────────────────────────────────────────────────────── */
        const TEMPLATES = [

                name: 'PANO-MIX',

                    { w: 0.265, slots: [{ h: 0.46 }, { h: 0.46 }] }, // two landscape
                    { w: 0.235, slots: [{ h: 1.0 }] },           // tall portrait

                    { w: 0.30, slots: [{ h: 1.0 }] },             // medium portrait

                // WIDE-HERO — 1 photo, full chunk

                    { w: 1.0, slots: [{ h: 1.0 }] },

                // DIPTYCH — 2 photos side by side

                    { w: 0.49, slots: [{ h: 1.0 }] },

                // TRIPTYCH — 3 equal columns
                name: 'TRIPTYCH',
                photosNeeded: 3,
                cols: [
                    { w: 0.32, slots: [{ h: 1.0 }] },
                    { w: 0.32, slots: [{ h: 1.0 }] },
                    { w: 0.32, slots: [{ h: 1.0 }] },

                name: 'QUAD',
                photosNeeded: 4,

                ]

        ];

        // Template cycle order for multi-chunk display
        const TEMPLATE_CYCLE = [
            'WIDE-HERO',   // chunk 1 of a pair often gets a hero
            'PANO-MIX',
            'ANCHOR-TRIO',
            'EDITORIAL',
            'PANO-MIX',
            'FEATURE-LEFT',
            'QUAD',
            'ANCHOR-TRIO',
            'TRIPTYCH',
        ];

        function pickTemplate(photoCount, cycleIndex) {
            // Find templates that fit the available photo count
            const cycle = TEMPLATE_CYCLE[cycleIndex % TEMPLATE_CYCLE.length];
            const preferred = TEMPLATES.find(t => t.name === cycle);
            if (preferred && preferred.photosNeeded <= photoCount) return preferred;
            // Fall back to best fit
            const fits = TEMPLATES.filter(t => t.photosNeeded <= photoCount);
            if (!fits.length) return TEMPLATES[TEMPLATES.indexOf(TEMPLATES.find(t => t.name === 'WIDE-HERO'))];
            return fits.reduce((best, t) =>
                Math.abs(t.photosNeeded - photoCount) < Math.abs(best.photosNeeded - photoCount) ? t : best
            );
        }

        function getChunkLayout() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            const HEADER_H = 110;
            const GAP_BETWEEN = 20;

            // Two chunks are always shown regardless of viewport width.
            // chunkW grows with the viewport so the first chunk's images
            // naturally become wider compositions on wide screens.
            // chunk heights are fixed fractions of available vertical space.
            const showTwo = true;
            const chunkW  = Math.min(Math.round(vw * 0.82), 1200);
            const totalH  = vh - HEADER_H - GAP_BETWEEN;
            const chunk1H = Math.round(totalH * 0.56);
            const chunk2H = Math.round(totalH * 0.38);

            return { chunkW, chunk1H, chunk2H, showTwo };
        }

        function renderChunk(photos, template, chunkW, chunkH, photoOffset) {
            // Returns HTML for one chunk
            const GAP = 10;
            let html = '<div class="gallery-chunk">';
            let photoIdx = photoOffset;

            template.cols.forEach((col, ci) => {
                const colW = Math.round(col.w * chunkW - (template.cols.length - 1) * GAP / template.cols.length);
                html += `<div class="gallery-col" style="width:${colW}px">`;

                col.slots.forEach((slot, si) => {
                    const slotH = Math.round(slot.h * chunkH - (col.slots.length - 1) * GAP / col.slots.length);
                    const photo = photos[photoIdx % photos.length]; // wrap if needed
                    const globalIdx = photoIdx;
                    const ax = photo?.zoom_anchor_x ?? 50;
                    const ay = photo?.zoom_anchor_y ?? 50;
                    const src = photo ? `${PATHS.images}${photo.src}` : '';

                    html += `
                    <div class="gallery-slot" style="height:${slotH}px;--focal-x:${ax}%;--focal-y:${ay}%"
                         onclick="openGalleryPhoto(${globalIdx % photos.length})">
                        <img src="${src}"
                             style="object-position:${ax}% ${ay}%"
                             data-idx="${globalIdx}"
                             onerror="this.classList.add('loaded');this.style.opacity='0'">
                    </div>`;
                    photoIdx++;
                });

                html += '</div>';
            });

            html += '</div>';
            return { html, photosUsed: photoIdx - photoOffset };
        }

        function renderChunkDisplay() {
            const container = document.getElementById('gallery-chunk-area');
            const navEl     = document.getElementById('gallery-chunk-nav');
            if (!container || !galleryPhotos.length) return;

            const { chunkW, chunk1H, chunk2H, showTwo } = getChunkLayout();

            // Update CSS variable so header and nav align with chunks
            const gridView = document.getElementById('gallery-grid-view');
            if (gridView) gridView.style.setProperty('--chunk-w', chunkW + 'px');

            let html = '';
            let photosUsed = 0;

            // Chunk 1
            const t1 = pickTemplate(
                galleryPhotos.length - chunkWindowStart,
                0
            );
            const c1 = renderChunk(galleryPhotos, t1, chunkW, chunk1H, chunkWindowStart);
            html += c1.html;
            photosUsed += c1.photosUsed;

            // Chunk 2 (if two-chunk mode)
            if (showTwo && (chunkWindowStart + photosUsed) < galleryPhotos.length) {
                const t2 = pickTemplate(
                    galleryPhotos.length - chunkWindowStart - photosUsed,
                    1
                );
                const c2 = renderChunk(
                    galleryPhotos, t2, chunkW, chunk2H,
                    chunkWindowStart + photosUsed
                );
                html += c2.html;
                photosUsed += c2.photosUsed;
            }

            container.innerHTML = html;

            // Update nav arrows
            if (navEl) {
                const prevBtn = navEl.querySelector('.gallery-chunk-arrow[data-dir="-1"]');
                const nextBtn = navEl.querySelector('.gallery-chunk-arrow[data-dir="1"]');
                if (prevBtn) prevBtn.disabled = chunkWindowStart <= 0;
                if (nextBtn) nextBtn.disabled = (chunkWindowStart + photosUsed) >= galleryPhotos.length;
            }

            // Fade in images with stagger
            attachSlotObserver();
        }

        function advanceChunks(dir) {
            const { showTwo, chunkW, chunk1H, chunk2H } = getChunkLayout();
            const t1 = pickTemplate(galleryPhotos.length - chunkWindowStart, 0);
            let used = t1.photosNeeded;
            if (showTwo) {
                const t2 = pickTemplate(galleryPhotos.length - chunkWindowStart - used, 1);
                used += t2.photosNeeded;
            }
            if (dir > 0) {
                chunkWindowStart = Math.min(chunkWindowStart + used, galleryPhotos.length - 1);
            } else {
                chunkWindowStart = Math.max(0, chunkWindowStart - used);
            }
            renderChunkDisplay();
        }

        function attachSlotObserver() {
            const imgs = document.querySelectorAll('.gallery-slot img:not(.loaded)');
            if (!imgs.length) return;
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach((entry, i) => {
                    if (!entry.isIntersecting) return;
                    const img = entry.target;
                    obs.unobserve(img);
                    const delay = i * 60;
                    const reveal = () => setTimeout(() => img.classList.add('loaded'), delay);
                    if (img.complete && img.naturalWidth > 0) reveal();
                    else { img.onload = reveal; img.onerror = () => img.classList.add('loaded'); }
                });
            }, { threshold: 0.05 });
            imgs.forEach(img => observer.observe(img));
        }

        // Keyboard conveyor — shift window by 1 photo
        function galleryKeyConveyor(dir) {
            if (dir > 0 && chunkWindowStart < galleryPhotos.length - 1) {
                chunkWindowStart++;
            } else if (dir < 0 && chunkWindowStart > 0) {
                chunkWindowStart--;
            }
            renderChunkDisplay();

   MOUNT FETCHING
   Fetches all mounts and their effective collection photos.
   Checks mount_schedules for active overrides including
   recurring schedules before falling back to default collection.
   ===================================================== */
async function fetchMounts() {
    try {
        const now = new Date();

        // Fetch mounts and their schedules in parallel
        const [mounts, schedules] = await Promise.all([
            fetch(`${SUPABASE_URL}/rest/v1/mounts?select=slug,collection_id,collections(id,photos:photo_collections(display_order,photos(src)))&order=display_order.asc`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            }).then(r => r.json()),
            fetch(`${SUPABASE_URL}/rest/v1/mount_schedules?select=*&order=scheduled_at.desc`, {
                headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
            }).then(r => r.json())
        ]);

        // For each mount, find the effective collection_id considering schedules
        const effectiveCollIds = {};
        for (const mount of (mounts || [])) {
            const mountSchedules = (schedules || []).filter(s => s.mount_id === mount.id || true);
            // Re-fetch with mount id — for now use default
            effectiveCollIds[mount.slug] = mount.collection_id;
        }

        // Fetch photos for each unique collection_id
        const collIds = [...new Set(Object.values(effectiveCollIds).filter(Boolean))];
        const photoMap = {};
        if (collIds.length) {
            const rows = await fetch(
                `${SUPABASE_URL}/rest/v1/photo_collections?select=collection_id,display_order,photos(src,published)&collection_id=in.(${collIds.join(',')})&photos.published=eq.true&order=display_order.asc`,
                { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
            ).then(r => r.json());
            for (const row of (rows || [])) {
                if (!photoMap[row.collection_id]) photoMap[row.collection_id] = [];
                if (row.photos?.src) photoMap[row.collection_id].push(row.photos.src);
            }
        }

        // Build siteMount: slug → array of photo srcs (first = default display)
        siteMount = {};
        for (const mount of (mounts || [])) {
            const collId = effectiveCollIds[mount.slug];
            siteMount[mount.slug] = collId ? (photoMap[collId] || []) : [];
        }
    } catch(err) {
        console.warn('[jnb] Mount fetch failed:', err.message);
        siteMount = {};
    }
}

function getMountPhoto(slug) {

    const photos = siteMount[slug] || [];
    return photos.length ? PATHS.images + photos[0] : null;

/* Mount schedule active check — handles none/yearly/monthly recurrence */
function isMountScheduleActive(schedule) {
    const now  = new Date();
    const start = new Date(schedule.scheduled_at);
    const end   = schedule.ends_at ? new Date(schedule.ends_at) : null;

    if (schedule.recurrence === 'none') {
        return start <= now && (!end || end > now);
    }

    if (schedule.recurrence === 'yearly') {
        // Adjust start/end to current year
        const thisYear = now.getFullYear();
        const s = new Date(start); s.setFullYear(thisYear);
        const e = end ? new Date(end) : null;
        if (e) {
            // Handle year-boundary: if end month < start month, end is next year
            if (e.getMonth() < s.getMonth() ||
               (e.getMonth() === s.getMonth() && e.getDate() < s.getDate())) {
                e.setFullYear(thisYear + 1);
            } else {
                e.setFullYear(thisYear);
            }
        }
        return s <= now && (!e || e > now);
    }

    if (schedule.recurrence === 'monthly') {
        const sDay = start.getDate();
        const eDay = end ? end.getDate() : null;
        const today = now.getDate();
        if (eDay === null) return today >= sDay;
        if (eDay >= sDay) return today >= sDay && today < eDay;
        // Wraps month boundary
        return today >= sDay || today < eDay;
    }

    return false;
}

        function formatMonth(ym) {
            if (!ym) return '';
            const [y, m] = ym.split('-');
            return new Date(+y, +m - 1, 1).toLocaleDateString('en-US', {
                month: 'long',
                year: 'numeric'
            });
        }

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d).toLocaleDateString('en-US', {
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
        }

        function formatTime(t) {
            // t is "HH:MM:SS" from Postgres
            const [h, min] = t.split(':').map(Number);
            const ampm = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 || 12;
            return `${h12}${min ? ':' + String(min).padStart(2,'0') : ''} ${ampm}`;
        }

        function shiftBookingMonth(dir) {
            const months = getAvailableMonths();
            const idx = months.indexOf(currentBookingMonth);
            const next = idx + dir;
            if (next < 0 || next >= months.length) return;
            currentBookingMonth = months[next];
            selectedPocketDay = null;
            renderDayCards();
            updateMonthNavButtons();
            document.getElementById('booking-month-label').textContent = formatMonth(currentBookingMonth);
            const ic = document.getElementById('booking-inquiry-col');
            const dc = document.getElementById('booking-days-col');
            if (ic) {
                ic.classList.remove('visible');
                ic.innerHTML = '';
            }
            if (dc) dc.classList.remove('dimmed');
        }

        function updateMonthNavButtons() {
            const months = getAvailableMonths();
            const idx = months.indexOf(currentBookingMonth);
            const prevBtn = document.getElementById('booking-prev-month');
            const nextBtn = document.getElementById('booking-next-month');
            if (prevBtn) prevBtn.style.opacity = idx <= 0 ? '0.2' : '1';
            if (nextBtn) nextBtn.style.opacity = idx >= months.length - 1 ? '0.2' : '1';
        }

        function renderDayCards() {
            const dayContainer = document.getElementById('booking-days');
            if (!dayContainer) return;

            const monthPockets = bookingPockets.filter(p => p.date.startsWith(currentBookingMonth));

            // Group by date
            const byDate = {};
            monthPockets.forEach(p => {
                if (!byDate[p.date]) byDate[p.date] = [];
                byDate[p.date].push(p);
            });

            const dates = Object.keys(byDate).sort();

            dayContainer.innerHTML = dates.map(date => {
                const pockets = byDate[date];
                const isSelected = selectedPocketDay === date;
                const windows = pockets.map(p =>
                    `<div class="booking-window">${formatTime(p.start_time)} – ${formatTime(p.end_time)}</div>`
                ).join('');

                return `
      <div class="booking-day-card ${isSelected ? 'selected' : ''}"
           onclick="selectDay('${date}')">
        <div class="booking-day-date">${formatDate(date)}</div>
        <div class="booking-day-windows">${windows}</div>
      </div>`;
            }).join('');
        }

        function selectDay(date) {
            const daysCol = document.getElementById('booking-days-col');
            const inquiryCol = document.getElementById('booking-inquiry-col');

            if (selectedPocketDay === date) {
                // Deselect
                selectedPocketDay = null;
                renderDayCards();
                if (daysCol) daysCol.classList.remove('dimmed');
                if (inquiryCol) {
                    inquiryCol.classList.remove('visible');
                    inquiryCol.innerHTML = '';
                }
                return;
            }
            selectedPocketDay = date;
            renderDayCards();
            if (daysCol) daysCol.classList.add('dimmed');
            showInquiryForm(date);
        }
