<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>jnb — admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Unbounded:wght@300;700;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a0a0a;
    --surface:   #111111;
    --border:    rgba(255,255,255,0.08);
    --border-hi: rgba(255,255,255,0.18);
    --red:       #c8001e;
    --cyan:      #00c8a0;
    --white:     #ffffff;
    --muted:     rgba(255,255,255,0.35);
    --font-ui:   'Unbounded', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --radius:    10px;
    --ease:      cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body {
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-mono);
    min-height: 100vh;
  }

  /* ── LOGIN ── */
  #login-screen {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 24px;
    z-index: 100;
    background: var(--bg);
    transition: opacity 0.4s ease;
  }
  #login-screen.hidden { opacity: 0; pointer-events: none; }

  .login-logo {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .login-title {
    font-family: var(--font-ui);
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--white);
  }

  .login-form {
    display: flex; flex-direction: column; gap: 12px;
    width: 300px;
  }
  .login-form input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 12px 16px;
    border-radius: var(--radius);
    outline: none;
    transition: border-color 0.15s;
    letter-spacing: 0.05em;
  }
  .login-form input:focus { border-color: var(--border-hi); }
  .login-form input.error { border-color: var(--red); }

  .btn-primary {
    background: var(--white);
    color: var(--bg);
    border: none;
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 13px 24px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary:hover { opacity: 0.85; }

  .login-error {
    font-size: 11px;
    color: var(--red);
    text-align: center;
    letter-spacing: 0.05em;
    min-height: 16px;
  }

  /* ── ADMIN SHELL ── */
  #admin-shell {
    display: none;
    min-height: 100vh;
  }
  #admin-shell.visible { display: block; }

  .admin-header {
    position: sticky; top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 56px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 50;
  }
  .admin-header-left {
    display: flex; align-items: center; gap: 16px;
  }
  .admin-wordmark {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--white);
  }
  .admin-badge {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-logout:hover { color: var(--white); border-color: var(--border-hi); }

  /* ── MAIN CONTENT ── */
  .admin-main {
    max-width: 960px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  .section-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  .section-title {
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .btn-add {
    background: var(--red);
    border: none;
    color: var(--white);
    font-family: var(--font-ui);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-add:hover { opacity: 0.85; }

  /* ── PHOTO CARDS ── */
  #photo-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .photo-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.15s;
  }
  .photo-card:hover { border-color: var(--border-hi); }

  .photo-card-header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    cursor: pointer;
    user-select: none;
  }

  .drag-handle {
    color: var(--muted);
    font-size: 14px;
    cursor: grab;
    flex-shrink: 0;
    opacity: 0.4;
  }

  .photo-thumb {
    width: 44px; height: 44px;
    object-fit: cover;
    border-radius: 6px;
    background: #1a1a1a;
    flex-shrink: 0;
  }

  .photo-card-info {
    flex: 1; min-width: 0;
  }
  .photo-card-name {
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--white);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .photo-card-src {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .photo-card-actions {
    display: flex; gap: 8px; align-items: center;
    flex-shrink: 0;
  }

  .btn-icon {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-family: var(--font-mono);
    letter-spacing: 0.05em;
    transition: color 0.15s, border-color 0.15s;
  }
  .btn-icon:hover { color: var(--white); border-color: var(--border-hi); }
  .btn-icon.danger:hover { color: var(--red); border-color: var(--red); }

  .expand-arrow {
    color: var(--muted);
    font-size: 10px;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .photo-card.open .expand-arrow { transform: rotate(180deg); }

  /* ── EXPANDED EDITOR ── */
  .photo-card-editor {
    display: none;
    padding: 0 18px 18px;
    border-top: 1px solid var(--border);
  }
  .photo-card.open .photo-card-editor { display: block; }

  .editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .editor-grid.single { grid-template-columns: 1fr; }
  .editor-grid.triple { grid-template-columns: 1fr 1fr 1fr; }

  .field {
    display: flex; flex-direction: column; gap: 6px;
  }
  .field label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    font-family: var(--font-ui);
    font-weight: 700;
  }
  .field input[type="text"],
  .field input[type="number"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s;
    letter-spacing: 0.03em;
    width: 100%;
  }
  .field input:focus { border-color: var(--border-hi); }

  /* Zoom anchor picker */
  .zoom-anchor-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 3/4;
    border-radius: 6px;
    overflow: hidden;
    cursor: crosshair;
    background: #1a1a1a;
    border: 1px solid var(--border);
  }
  .zoom-anchor-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    image-rendering: pixelated;
  }
  .zoom-anchor-dot {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--cyan);
    border: 2px solid var(--white);
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 0 3px rgba(0,200,160,0.3);
    transition: left 0.15s ease, top 0.15s ease;
  }
  .zoom-anchor-hint {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  /* Sliders */
  .field input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: var(--border-hi);
    border-radius: 1px;
    outline: none;
    cursor: pointer;
    margin-top: 6px;
  }
  .field input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--white);
    cursor: pointer;
  }
  .slider-val {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
    text-align: right;
  }

  /* Save button */
  .btn-save {
    background: var(--cyan);
    color: var(--bg);
    border: none;
    font-family: var(--font-ui);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 16px;
    transition: opacity 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .btn-save:hover { opacity: 0.85; }
  .btn-save.saving { opacity: 0.6; pointer-events: none; }

  /* ── NEW PHOTO FORM ── */
  #new-photo-panel {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  #new-photo-panel.visible { display: block; }

  .new-photo-title {
    font-family: var(--font-ui);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: 16px;
  }

  /* ── STATUS TOAST ── */
  #toast {
    position: fixed;
    bottom: 32px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface);
    border: 1px solid var(--border-hi);
    color: var(--white);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 10px 20px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s var(--ease);
    z-index: 200;
    white-space: nowrap;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #toast.success { border-color: var(--cyan); color: var(--cyan); }
  #toast.error   { border-color: var(--red);  color: var(--red);  }

  /* ── LOADING STATE ── */
  .loading-row {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-logo">jnb visions</div>
  <div class="login-title">Admin</div>
  <form class="login-form" onsubmit="attemptLogin(event)">
    <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password">
    <button type="submit" class="btn-primary">Enter</button>
    <div class="login-error" id="login-error"></div>
  </form>
</div>

<!-- ADMIN SHELL -->
<div id="admin-shell">
  <header class="admin-header">
    <div class="admin-header-left">
      <span class="admin-wordmark">jnb visions</span>
      <span class="admin-badge">Gallery Admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">Log out</button>
  </header>

  <main class="admin-main">

    <!-- NEW PHOTO PANEL -->
    <div id="new-photo-panel">
      <div class="new-photo-title">Add Photo</div>
      <div class="editor-grid">
        <div class="field">
          <label>Filename</label>
          <input type="text" id="new-src" placeholder="photo.jpg">
        </div>
        <div class="field">
          <label>Collection</label>
          <input type="text" id="new-collection" value="portraits">
        </div>
        <div class="field">
          <label>First Name</label>
          <input type="text" id="new-first">
        </div>
        <div class="field">
          <label>Last Name</label>
          <input type="text" id="new-last">
        </div>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;">
        <button class="btn-save" onclick="createPhoto()">Save Photo</button>
        <button class="btn-icon" onclick="closeNewPanel()">Cancel</button>
      </div>
    </div>

    <!-- PHOTO LIST -->
    <div class="section-header">
      <span class="section-title">Portraits</span>
      <button class="btn-add" onclick="openNewPanel()">+ Add Photo</button>
    </div>
    <div id="photo-list">
      <div class="loading-row">Loading...</div>
    </div>

  </main>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
/* =====================================================
   CONFIG
   ===================================================== */
const SUPABASE_URL = 'https://xzhiblzvgeqtlicbstzu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh6aGlibHp2Z2VxdGxpY2JzdHp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNDE2MjksImV4cCI6MjA5NTgxNzYyOX0.QZiINBDncHEKUUDTFG2H9RH1R_QSI9hH-B5vkFT5sBM';

/* Change this password in the file if needed.
   Keep this file at an obscure, unlinked URL. */
const ADMIN_PASSWORD = 'taxnbaxn';

/* Path prefix for photos — adjust if images live in a subfolder */
const PHOTO_PATH = './';

/* =====================================================
   AUTH
   ===================================================== */
function attemptLogin(e) {
  e.preventDefault();
  const pw = document.getElementById('pw-input').value;
  if (pw === ADMIN_PASSWORD) {
    sessionStorage.setItem('jnb_admin', '1');
    document.getElementById('login-screen').classList.add('hidden');
    setTimeout(() => {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-shell').classList.add('visible');
      loadPhotos();
    }, 400);
  } else {
    const input = document.getElementById('pw-input');
    const err   = document.getElementById('login-error');
    input.classList.add('error');
    err.textContent = 'Incorrect password.';
    setTimeout(() => {
      input.classList.remove('error');
      err.textContent = '';
    }, 2000);
  }
}

function logout() {
  sessionStorage.removeItem('jnb_admin');
  location.reload();
}

// Auto-login if session exists
if (sessionStorage.getItem('jnb_admin') === '1') {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('admin-shell').classList.add('visible');
  loadPhotos();
}

/* =====================================================
   SUPABASE HELPERS
   ===================================================== */
const SB_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json',
  'Prefer': 'return=representation'
};

async function sbFetch(path, opts = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    headers: SB_HEADERS,
    ...opts
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error(err);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

/* =====================================================
   DATA
   ===================================================== */
let photos = [];

async function loadPhotos() {
  try {
    photos = await sbFetch('/rest/v1/photos?select=*&order=display_order.asc');
    renderPhotoList();
  } catch (err) {
    document.getElementById('photo-list').innerHTML =
      `<div class="loading-row" style="color:var(--red)">Failed to load: ${err.message}</div>`;
  }
}

async function savePhoto(id, data) {
  await sbFetch(`/rest/v1/photos?id=eq.${id}`, {
    method: 'PATCH',
    body: JSON.stringify(data)
  });
}

async function createPhoto() {
  const src        = document.getElementById('new-src').value.trim();
  const collection = document.getElementById('new-collection').value.trim() || 'portraits';
  const first      = document.getElementById('new-first').value.trim();
  const last       = document.getElementById('new-last').value.trim();
  if (!src) { showToast('Filename is required', 'error'); return; }

  try {
    const order = photos.length ? Math.max(...photos.map(p => p.display_order)) + 1 : 1;
    await sbFetch('/rest/v1/photos', {
      method: 'POST',
      body: JSON.stringify({
        src, first_name: first, last_name: last,
        collection, display_order: order,
        logo_y: 50, info_y: 55,
        zoom_anchor_x: 50, zoom_anchor_y: 50, zoom_ratio: 0.65
      })
    });
    showToast('Photo added', 'success');
    closeNewPanel();
    await loadPhotos();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  }
}

async function deletePhoto(id) {
  if (!confirm('Delete this photo entry? The image file is unaffected.')) return;
  try {
    await sbFetch(`/rest/v1/photos?id=eq.${id}`, { method: 'DELETE' });
    showToast('Deleted', 'success');
    await loadPhotos();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  }
}

async function movePhoto(id, direction) {
  const idx = photos.findIndex(p => p.id === id);
  const swapIdx = idx + direction;
  if (swapIdx < 0 || swapIdx >= photos.length) return;

  const a = photos[idx];
  const b = photos[swapIdx];
  try {
    await Promise.all([
      savePhoto(a.id, { display_order: b.display_order }),
      savePhoto(b.id, { display_order: a.display_order })
    ]);
    await loadPhotos();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
  }
}

/* =====================================================
   RENDER
   ===================================================== */
function renderPhotoList() {
  const list = document.getElementById('photo-list');
  if (!photos.length) {
    list.innerHTML = '<div class="loading-row">No photos yet. Add one above.</div>';
    return;
  }

  list.innerHTML = photos.map((p, i) => `
    <div class="photo-card" id="card-${p.id}">
      <div class="photo-card-header" onclick="toggleCard('${p.id}')">
        <span class="drag-handle">⠿</span>
        <img class="photo-thumb"
             src="${PHOTO_PATH}${p.src}"
             onerror="this.style.background='#2a2a2a';this.removeAttribute('src')"
             alt="">
        <div class="photo-card-info">
          <div class="photo-card-name">${p.first_name} ${p.last_name}</div>
          <div class="photo-card-src">${p.src}</div>
        </div>
        <div class="photo-card-actions" onclick="event.stopPropagation()">
          <button class="btn-icon" onclick="movePhoto('${p.id}', -1)" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn-icon" onclick="movePhoto('${p.id}', 1)" ${i === photos.length-1 ? 'disabled' : ''}>↓</button>
          <button class="btn-icon danger" onclick="deletePhoto('${p.id}')">Delete</button>
        </div>
        <span class="expand-arrow">▼</span>
      </div>
      <div class="photo-card-editor">
        ${renderEditor(p)}
      </div>
    </div>
  `).join('');

  // Attach zoom anchor pickers
  photos.forEach(p => attachZoomPicker(p));
}

function renderEditor(p) {
  return `
    <div class="editor-grid">
      <div class="field">
        <label>First Name</label>
        <input type="text" id="first-${p.id}" value="${p.first_name}">
      </div>
      <div class="field">
        <label>Last Name</label>
        <input type="text" id="last-${p.id}" value="${p.last_name}">
      </div>
      <div class="field">
        <label>Filename</label>
        <input type="text" id="src-${p.id}" value="${p.src}">
      </div>
      <div class="field">
        <label>Zoom Ratio (h/w, landscape mode)</label>
        <input type="number" id="ratio-${p.id}" value="${p.zoom_ratio}" step="0.01" min="0.3" max="2">
      </div>
    </div>

    <div class="editor-grid triple" style="margin-top:12px">
      <div class="field">
        <label>Logo Y <span class="slider-val" id="logoY-val-${p.id}">${p.logo_y}%</span></label>
        <input type="range" id="logoY-${p.id}" min="0" max="100" value="${p.logo_y}"
          oninput="document.getElementById('logoY-val-${p.id}').textContent=this.value+'%'">
      </div>
      <div class="field">
        <label>Info Y <span class="slider-val" id="infoY-val-${p.id}">${p.info_y}%</span></label>
        <input type="range" id="infoY-${p.id}" min="0" max="100" value="${p.info_y}"
          oninput="document.getElementById('infoY-val-${p.id}').textContent=this.value+'%'">
      </div>
      <div class="field">
        <label>Zoom Ratio <span class="slider-val" id="ratio-val-${p.id}">${p.zoom_ratio}</span></label>
        <input type="range" id="ratio-slider-${p.id}" min="0.3" max="1.5" step="0.01" value="${p.zoom_ratio}"
          oninput="document.getElementById('ratio-val-${p.id}').textContent=parseFloat(this.value).toFixed(2);document.getElementById('ratio-${p.id}').value=this.value">
      </div>
    </div>

    <div style="margin-top:16px">
      <div class="field">
        <label>Zoom Anchor — click to set focal point</label>
        <div class="zoom-anchor-wrap" id="anchor-wrap-${p.id}"
             onclick="setZoomAnchor('${p.id}', event)">
          <img src="${PHOTO_PATH}${p.src}"
               onerror="this.style.display='none'"
               alt="">
          <div class="zoom-anchor-dot" id="anchor-dot-${p.id}"
               style="left:${p.zoom_anchor_x}%;top:${p.zoom_anchor_y}%"></div>
        </div>
        <div class="zoom-anchor-hint">
          Anchor: <span id="anchor-val-${p.id}">${p.zoom_anchor_x}%, ${p.zoom_anchor_y}%</span>
        </div>
      </div>
    </div>

    <button class="btn-save" onclick="saveSinglePhoto('${p.id}')">
      Save Changes
    </button>
  `;
}

function attachZoomPicker(p) {
  // Zoom anchor is set via onclick on the wrap element (already in renderEditor)
  // Just ensure dot is positioned correctly
  const dot = document.getElementById(`anchor-dot-${p.id}`);
  if (dot) {
    dot.style.left = p.zoom_anchor_x + '%';
    dot.style.top  = p.zoom_anchor_y + '%';
  }
}

function setZoomAnchor(id, event) {
  const wrap = document.getElementById(`anchor-wrap-${id}`);
  const rect = wrap.getBoundingClientRect();
  const x = Math.round(((event.clientX - rect.left) / rect.width)  * 100);
  const y = Math.round(((event.clientY - rect.top)  / rect.height) * 100);
  const dot = document.getElementById(`anchor-dot-${id}`);
  dot.style.left = x + '%';
  dot.style.top  = y + '%';
  document.getElementById(`anchor-val-${id}`).textContent = `${x}%, ${y}%`;
  // Store on dot for save to read
  dot.dataset.x = x;
  dot.dataset.y = y;
}

function toggleCard(id) {
  const card = document.getElementById(`card-${id}`);
  card.classList.toggle('open');
}

/* =====================================================
   SAVE
   ===================================================== */
async function saveSinglePhoto(id) {
  const btn = document.querySelector(`#card-${id} .btn-save`);
  btn.classList.add('saving');
  btn.textContent = 'Saving...';

  const dot = document.getElementById(`anchor-dot-${id}`);
  const ax = dot.dataset.x !== undefined ? parseInt(dot.dataset.x) :
             parseFloat(photos.find(p => p.id === id)?.zoom_anchor_x ?? 50);
  const ay = dot.dataset.y !== undefined ? parseInt(dot.dataset.y) :
             parseFloat(photos.find(p => p.id === id)?.zoom_anchor_y ?? 50);

  const data = {
    src:           document.getElementById(`src-${id}`).value.trim(),
    first_name:    document.getElementById(`first-${id}`).value.trim(),
    last_name:     document.getElementById(`last-${id}`).value.trim(),
    logo_y:        parseFloat(document.getElementById(`logoY-${id}`).value),
    info_y:        parseFloat(document.getElementById(`infoY-${id}`).value),
    zoom_anchor_x: ax,
    zoom_anchor_y: ay,
    zoom_ratio:    parseFloat(document.getElementById(`ratio-${id}`).value)
  };

  try {
    await savePhoto(id, data);
    showToast('Saved', 'success');
    await loadPhotos();
  } catch (err) {
    showToast('Error: ' + err.message, 'error');
    btn.classList.remove('saving');
    btn.textContent = 'Save Changes';
  }
}

/* =====================================================
   NEW PHOTO PANEL
   ===================================================== */
function openNewPanel() {
  document.getElementById('new-photo-panel').classList.add('visible');
  document.getElementById('new-src').focus();
}
function closeNewPanel() {
  document.getElementById('new-photo-panel').classList.remove('visible');
  ['new-src','new-first','new-last'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('new-collection').value = 'portraits';
}

/* =====================================================
   TOAST
   ===================================================== */
let toastTimer;
function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, 2500);
}
</script>
</body>
