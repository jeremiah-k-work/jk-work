<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>jnb visions</title>
<style>
  @font-face {
    font-family: 'Archivo';
    src: url('fonts/Archivo-VariableFont_wdth,wght.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: 'Unbounded';
    src: url('fonts/Unbounded-Variable.ttf') format('truetype');
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red: #c8001e;
    --black: #000;
    --white: #fff;
    --gray-outline: rgba(160,160,160,0.65);
    --card-w: min(300px, 72vw);
    --card-h: calc(var(--card-w) * 1.32);
    /* Gallery width capped so outline never leaves the viewport.
       90vw felt large; 82vw gives breathing room on all window sizes. */
    --gallery-w: min(480px, 82vw);
    --gallery-h: calc(var(--gallery-w) * 1.28);
    /* Outline gap: 4vh per side (was 3.5vh offset + 7vh total).
       Stored as a single variable so frame, rect, and border-radius
       all stay in sync from one place. */
    --outline-gap: 4vh;
    --expanded-w: min(800px, 92vw);
    --expanded-h: calc(var(--expanded-w) * 0.78);
    --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
    --font-primary: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-secondary: 'Unbounded', 'Helvetica Neue', Helvetica, sans-serif;
    /* How far the GALLERY word rises toward the top in gallery state.
       Negative = upward. Adjust this one value to reposition the word. */
    --nav-gallery-rise: -88vh;
    /* Gallery nav: how far from bottom the nav's bottom edge should sit.
       Increase to move the nav higher up the screen. */
    --nav-gallery-bottom-margin: 8vh;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--black);
    overflow: hidden;
    font-family: var(--font-primary);
    color: var(--white);
    cursor: none;
    user-select: none;
  }
  /* Propagate cursor:none everywhere so no system cursor leaks on buttons etc. */
  * { cursor: none !important; }

  /* ===== CUSTOM CURSOR ===== */
  /* Cursor core — snaps exactly to pointer */
  #cursor-core {
    position: fixed;
    top: 0; left: 0;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffffff;
    pointer-events: none;
    z-index: 9999;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  /* Positioner — carries the orbiter to the right place via translate.
     Zero size so it doesn't affect layout. */
  #cursor-orbiter-pos {
    position: fixed;
    top: 0; left: 0;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 9999;
    will-change: transform;
    opacity: 0;
    transition: opacity 0.2s ease;
  }

  /* Orbiter — centred on the positioner point via negative margin.
     Scale animates from its own centre, not the viewport origin. */
  #cursor-orbiter {
    position: absolute;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid rgba(255, 255, 255, 0.8);
    /* Pull back by half own size so it centres on the positioner point */
    top: -7px; left: -7px;
    transform-origin: center center;
    transition: width 0.15s ease, height 0.15s ease,
                top 0.15s ease, left 0.15s ease,
                border-color 0.15s ease;
  }
  /* Left-click: orbiter shrinks and moves inward, springs back on release */
  #cursor-orbiter.pressed-left {
    width: 9px;
    height: 9px;
    top: -4.5px; left: -4.5px;
    border-color: rgba(255, 255, 255, 0.4);
  }
  #cursor-orbiter.springing {
    animation: orbiterSpring 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes orbiterSpring {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.9); }
    62%  { transform: scale(0.88); }
    100% { transform: scale(1); }
  }

  /* Right-click: orbiter shrinks in place */
  #cursor-orbiter.pressed-right {
    width: 8px;
    height: 8px;
    top: -4px; left: -4px;
    border-color: rgba(255, 255, 255, 0.6);
  }

  /* Inner fill circle — child of orbiter, grows to fill on right-click */
  #cursor-orbiter-fill {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #ffffff;
    transform: scale(0);
    transform-origin: center center;
    transition: transform 0.18s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  #cursor-orbiter.pressed-right #cursor-orbiter-fill {
    transform: scale(1);
  }

  /* ===== RED LINE SVG ===== */
  #red-line {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  #red-line.hidden { opacity: 0; }

  /* ===== INTRO SCENE ===== */
  #intro-scene {
    position: fixed; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Gap compresses tightly on small windows */
    gap: clamp(16px, 4vw, 60px);
    /* Padding so nothing ever touches the edge */
    padding: 0 clamp(12px, 3vw, 40px);
    z-index: 1;
    opacity: 1;
    transition: opacity 0.5s ease;
  }
  #intro-scene.hidden {
    opacity: 0;
    pointer-events: none;
  }

  /* Left column: VISIONS label */
  #visions-label {
    position: fixed;
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: var(--font-secondary);
    font-size: clamp(8px, 1vw, 11px);
    font-weight: 400;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--red);
    line-height: 1;
    pointer-events: none;
    z-index: 1;
    /* left/top set by JS — transitions with opacity for smooth enter/exit */
    transition: opacity 0.5s ease, left 0.75s var(--ease-expo);
  }
  @media (max-width: 480px) {
    #visions-label { display: none; }
  }

  /* Centre column: the card */
  /* ===== UNIFIED FRAME =====
     Intro:   position:relative, flex child, card dimensions.
     Gallery: position:fixed, centred, gallery dimensions.
     CRITICAL: no z-index on any child — stacking is document order only.
     This keeps overflow:hidden clipping intact when position:fixed is applied,
     because no child is promoted to its own compositor layer.
  */
  /* ===== INTRO SPACER =====
     Invisible placeholder in intro-scene that reserves the space
     the frame visually occupies, keeping label and nav correctly flanking it. */
  #intro-spacer {
    width: min(var(--card-w), 55vw);
    height: calc(min(var(--card-w), 55vw) * 1.32);
    flex-shrink: 1;
    pointer-events: none;
  }

  /* unified-frame: handles size and position only.
     No overflow, no border-radius — those live on #frame-inner.
     z-index only applied when detached (gallery state) so gallery-tap
     sits above gallery chrome elements that would otherwise intercept clicks. */
  #unified-frame {
    /* Always fixed — body child, never inherits pointer-events from intro-scene.
       In intro: JS positions it over the spacer.
       In gallery (detached): JS centres it at 50%/50%. */
    position: fixed;
    z-index: 15;
    transition:
      width     0.75s var(--ease-expo),
      height    0.75s var(--ease-expo),
      top       0.75s var(--ease-expo),
      left      0.75s var(--ease-expo),
      transform 0.75s var(--ease-expo);
  }

  /* frame-inner: always position:relative, always the same positioning model.
     Carries overflow:hidden and border-radius — these never break in Safari
     because this element is never promoted or repositioned. */
  #frame-inner {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    overflow: hidden;
    transition: border-radius 0.75s var(--ease-expo);
  }
  /* Gallery border-radius applied when frame expands */
  #unified-frame.detached #frame-inner {
    border-radius: 12vh;
  }

  /* Children — no z-index, no will-change. Document order = paint order. */

  #intro-photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    /* No opaque background — prevents WebKit compositing bug where a solid
       background on a child of overflow:hidden + border-radius bleeds outside
       the rounded clip. The red overlay covers any gap during loading. */
  }

  /* Dark plate — covers intro-photo during gallery session.
     Fades in on enter, fades out on exit.
     Also provides a clean dark base when gallery-photo fades between slides. */
  #photo-plate {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    /* 1px border-radius forces WebKit to respect the overflow:hidden clip
       on the parent — same compositing quirk as intro-photo. */
    border-radius: 1px;
    transition: opacity 0.65s cubic-bezier(0.7, 0, 0.15, 1);
  }
  #photo-plate.visible { opacity: 1; }

  #gallery-photo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    background: transparent;
    opacity: 0;
    image-rendering: pixelated;
    transition: opacity 0.55s ease,
                object-position 0.75s var(--ease-expo);
  }
  #gallery-photo.loaded { opacity: 1; }

  #intro-overlay {
    position: absolute; inset: 0;
    background: var(--red);
    mix-blend-mode: difference;
    /* Slow cinematic lift — ease-in so it lingers at full opacity
       before gradually fading, giving a sense of the curtain rising. */
    transition: opacity 1.4s cubic-bezier(0.4, 0, 0.6, 1);
    pointer-events: none;
  }
  #intro-overlay.lifted { opacity: 0; }



  #gallery-tap {
    position: absolute; inset: 0;
    display: none;
  }
  #gallery-tap.active { display: block; }

  /* ===== UNIFIED NAV =====
     Single fixed container, always in the DOM.
     Intro: JS positions left edge flush with frame right edge.
     Gallery: bottom-centre, width clamped to visible children only.

     The Gallery word grows large in gallery state but must NOT
     influence the container width — it overflows visually while
     contributing zero layout width via width:0 + overflow:visible.
     This keeps the container centring correct. */

  #nav-unified {
    position: fixed;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(10px, 2vh, 18px);
    z-index: 20;
    overflow: visible;
    /* Transition left and transform only.
       top/bottom are NOT transitioned — they snap via JS inline styles
       to avoid the top↔bottom interpolation problem on return. */
    transition:
      left      0.75s var(--ease-expo),
      transform 0.75s var(--ease-expo);
  }
  /* Suppress ALL transitions when snapping back to intro position */
  #nav-unified.no-transition {
    transition: none !important;
  }

  /* Gallery state: horizontal centering only.
     top/bottom are set by JS as inline styles so we can use bottom
     directly (no height measurement needed) without CSS conflicts.
     pointer-events:none on container prevents overflow:visible hit area
     from intercepting clicks on the photo — buttons re-enable themselves. */
  #nav-unified.gallery {
    left: 50% !important;
    right: auto !important;
    transform: translateX(-50%) !important;
    align-items: center;
    pointer-events: none;
  }
  #nav-unified.gallery .nav-word {
    pointer-events: all;
  }

  /* Base word */
  .nav-word {
    background: transparent;
    border: none;
    font-family: var(--font-secondary);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    line-height: 1;
    white-space: nowrap;
    position: relative;
    padding: 0;
    transition:
      font-size      0.75s var(--ease-expo),
      color          0.25s ease,
      opacity        0.75s var(--ease-expo),
      transform      0.75s var(--ease-expo),
      letter-spacing 0.75s var(--ease-expo);
  }
  .nav-word::after {
    content: '';
    position: absolute;
    bottom: -2px; left: 0;
    width: 0; height: 1px;
    background: currentColor;
    transition: width 0.22s var(--ease-expo);
  }
  .nav-word:hover::after { width: 100%; }

  /* ── GALLERY word ──
     Intro: normal size, in flow.
     Gallery: zero layout width so it cannot affect container centring.
     The word overflows visually. translateX(-50%) centres it on the
     container's centreline regardless of the word's own rendered width.
     translateY lifts it to the top of the screen. */
  #nav-gallery {
    font-size: clamp(10px, 1.4vw, 14px);
    font-weight: 700;
    color: var(--white);
    opacity: 1;
    width: auto;
    transform: none;
  }
  #nav-unified.gallery #nav-gallery {
    /* width:100% fills the viewport (fixed context), text-align:center
       on the container centres the text within it. */
    width: 100vw;
    font-size: clamp(48px, 18vw, 120px);
    letter-spacing: 0.05em;
    color: var(--white);
    opacity: 0.045;
    pointer-events: none;
    /* --nav-gallery-rise is defined in :root — change it there to reposition */
    transform: translateY(var(--nav-gallery-rise));
  }
  /* Centre the overflowing Gallery word on the container centreline */
  #nav-unified.gallery {
    text-align: center;
  }

  /* ── CONNECT word ── */
  #nav-connect {
    font-size: clamp(10px, 1.4vw, 14px);
    font-weight: 400;
    color: rgba(255,255,255,0.45);
    opacity: 1;
    transform: none;
  }
  #nav-unified.gallery #nav-connect {
    font-size: clamp(9px, 1.1vw, 12px);
    color: rgba(255,255,255,0.38);
  }
  #nav-connect:hover { color: rgba(255,255,255,0.85); }

  /* ── BACK word ── */
  #nav-back {
    font-family: var(--font-primary);
    font-size: clamp(10px, 1.4vw, 14px);
    font-weight: 400;
    color: rgba(255,255,255,0.38);
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }
  #nav-unified.gallery #nav-back {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }
  #nav-back:hover { color: rgba(255,255,255,0.85); }

  /* ===== OUTLINE RECT =====
     Fixed, positioned and sized by JS to wrap unified-frame.
     Hidden in intro, fades in during morph. */
  #outline-rect {
    position: fixed;
    border: 2px solid var(--gray-outline);
    border-radius: calc(12vh + var(--outline-gap));
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition:
      opacity       0.5s ease,
      width         0.75s var(--ease-expo),
      height        0.75s var(--ease-expo),
      top           0.75s var(--ease-expo),
      left          0.75s var(--ease-expo),
      border-radius 0.75s var(--ease-expo);
  }
  #outline-rect.rect-visible { opacity: 1; }

  /* ===== UNIFIED LOGO =====
     Single fixed element. JS positions it in all states:
     intro: centred over the frame card
     gallery: offset to the left edge of the gallery photo
     expanded: centred below the photo
     Transitions continuously — no swap, no opacity toggle. */
  #logo {
    position: fixed;
    pointer-events: none;
    z-index: 17;
    transition:
      left   0.75s var(--ease-expo),
      top    0.75s var(--ease-expo),
      width  0.75s var(--ease-expo),
      transform 0.75s var(--ease-expo),
      opacity 0.5s ease;
  }
  #logo img { width: 100%; display: block; }

  /* ===== INFO PANEL ===== */
  #info-panel {
    position: fixed;
    right: -300px;
    opacity: 0;
    pointer-events: none;
    transition: right 0.7s var(--ease-expo), opacity 0.4s ease,
                top 0.7s var(--ease-expo);
    z-index: 16;
    text-align: right;
  }
  #info-panel.visible { opacity: 1; }

  .info-name-first {
    font-family: var(--font-secondary);
    font-size: clamp(10px, 2.2vw, 34px);
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1;
    color: var(--white);
    margin: 0px 8px;
  }
  .info-name-last {
    font-family: var(--font-secondary);
    display: inline-block;
    background: var(--white);
    color: var(--black);
    font-size: clamp(10px, 2.2vw, 34px);
    font-weight: 300;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0px 40px 0px 8px;
    line-height: 1.4;
    margin-top: 5px;
  }

  /* ===== WATERMARKS ===== */
  #watermark-left, #watermark-right {
    position: fixed;
    top: 0; bottom: 0;
    writing-mode: vertical-rl;
    font-family: var(--font-secondary);
    font-size: 9px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(180,0,0,0.55);
    font-weight: 600;
    pointer-events: none;
    display: flex; align-items: center;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 1;
  }
  #watermark-left { left: 8px; }
  #watermark-right { right: 8px; transform: rotate(180deg); }
  #watermark-left.visible, #watermark-right.visible { opacity: 1; }

  /* ===== NAV ===== */
  #nav-prev, #nav-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.3);
    font-family: var(--font-secondary);
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, color 0.15s;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    z-index: 5;
  }
  #nav-prev { left: 24px; }
  #nav-next { right: 24px; }
  #nav-prev.visible, #nav-next.visible { opacity: 1; pointer-events: all; }
  #nav-prev:hover, #nav-next:hover { color: rgba(255,255,255,0.8); }
  .nav-line { width: 1px; height: 40px; background: currentColor; display: block; }



  /* ===== KEYBOARD HINT ===== */
  #kbd-hint {
    position: fixed;
    bottom: 10px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-secondary);
    font-size: 7px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.12);
    opacity: 0; pointer-events: none;
    transition: opacity 0.4s ease;
    white-space: nowrap;
  }
  #kbd-hint.visible { opacity: 1; }

  /* ===== FADE UTILITY ===== */
  .fade-in { animation: fadeIn 0.45s ease both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== RED LINE IDLE ANIMATION ===== */
  #red-line-group {
    animation: redLineIdle 8s ease-in-out infinite;
    transform-origin: 500px 300px; /* SVG centre — same as the rotate pivot */
    transform-box: fill-box;
  }
  @keyframes redLineIdle {
    0%   { transform: rotate(-15deg) translate(0px,   0px); }
    25%  { transform: rotate(-15deg) translate(6px,  -4px); }
    50%  { transform: rotate(-15deg) translate(0px,  -8px); }
    75%  { transform: rotate(-15deg) translate(-6px, -4px); }
    100% { transform: rotate(-15deg) translate(0px,   0px); }
  }
</style>
</head>
<body>

<!-- RED LINE -->
<svg id="red-line" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <!--
    Path extended well beyond the viewBox so ends are never visible
    at any window proportion. preserveAspectRatio="xMidYMid slice"
    ensures the SVG fills the viewport rather than letterboxing.
    The group rotation of -15deg matches the original design.
    A slow CSS animation gently undulates the path via a secondary
    translate on the group, giving an idle breathing quality.
  -->
  <g transform="rotate(-15, 500, 300)" id="red-line-group">
    <path
      id="red-line-path"
      d="M -400,450 L 480,450 Q 740,450 740,190 L 740,-200"
      fill="none"
      stroke="#c8001e"
      stroke-width="2"
      stroke-linecap="round"
    />
  </g>
</svg>

<!-- UNIFIED FRAME — direct child of body, never inside intro-scene.
     Isolated from any pointer-events:none on parent elements.
     In intro: positioned by JS to overlap the spacer in intro-scene.
     In gallery: centred via translate(-50%,-50%). -->
<div id="unified-frame">
  <div id="frame-inner">
    <img id="intro-photo" src="images/9N2A2754--e1-Vibrant.jpg" alt="Artist portrait">
    <!-- Dark plate sits between intro-photo and gallery-photo.
         Fades in when entering gallery (covers jnb),
         fades out when exiting (reveals jnb under overlay). -->
    <div id="photo-plate"></div>
    <img id="gallery-photo" alt="">
    <div id="intro-overlay"></div>
  </div>
  <div id="gallery-tap" onclick="toggleExpanded()"></div>
</div>

<!-- INTRO SCENE — spacer only; label and nav are fixed elements -->
<div id="intro-scene">
  <!-- Spacer holds the space the frame visually occupies,
       keeping intro-scene the right width for JS measurements -->
  <div id="intro-spacer"></div>
</div>

<!-- VISIONS LABEL — fixed, positioned by JS left of the frame -->
<div id="visions-label">Visions</div>

<!-- OUTLINE RECT — fixed, positioned by JS to wrap unified-frame -->
<div id="outline-rect"></div>

<!-- UNIFIED LOGO — single element, repositioned by JS in all states -->
<div id="logo">
  <img id="logo-img" alt="jnb visions">
</div>

<!-- INFO PANEL -->
<div id="info-panel">
  <div class="info-name-first" id="info-first"></div>
  <div class="info-name-last" id="info-last"></div>
</div>

<!-- WATERMARKS -->
<div id="watermark-left">Visions Visions Visions Visions Visions Visions Visions Visions Visions Visions</div>
<div id="watermark-right">Visions Visions Visions Visions Visions Visions Visions Visions Visions Visions</div>

<!-- NAV -->
<button id="nav-prev" onclick="navigate(-1)">
  <span class="nav-line"></span>
  <span>Prev</span>
</button>
<button id="nav-next" onclick="navigate(1)">
  <span>Next</span>
  <span class="nav-line"></span>
</button>

<!-- UNIFIED NAV
     All navigation words live here always.
     State is driven by #nav-unified.gallery class.
     CSS transitions carry each word smoothly between positions. -->
<nav id="nav-unified">
  <button id="nav-gallery"  class="nav-word" onclick="enterGallery('portraits')">Gallery</button>
  <button id="nav-connect"  class="nav-word" onclick="goConnect()">Connect</button>
  <button id="nav-back"     class="nav-word" onclick="exitGallery()">Back</button>
</nav>

<!-- KEYBOARD HINT -->
<div id="kbd-hint">&#8592; &nbsp; Arrow keys to navigate &nbsp; &#8594;</div>

<!-- CUSTOM CURSOR -->
<div id="cursor-core"></div>
<div id="cursor-orbiter-pos">
  <div id="cursor-orbiter"><div id="cursor-orbiter-fill"></div></div>
</div>

<script>
/* =====================================================
   CONFIGURATION
   =====================================================

   LOGO: single source of truth. Change this filename
   and both logo placements update automatically.

   GALLERY entries:
     src:        image filename (same folder as this HTML)
     first:      subject first name — Unbounded, uppercase, white
     last:       subject last name — Unbounded, white pill

    const params = new URLSearchParams({

          'Authorization': `Bearer ${SUPABASE_KEY}`
      }}
    );
    if (!res.ok) throw new Error('Supabase fetch failed');
    const rows = await res.json();

    // For each photo, fetch its subject credits separately
    // (Supabase free tier doesn't support deep nested joins via REST easily)
    const photoIds = rows.map(r => r.photos.id);
    let credits = [];
    if (photoIds.length) {
      const credParams = new URLSearchParams({
        select: 'photo_id,role,people(first_name,last_name)',

    });

    const portraits = rows.map(r => {

/* =====================================================
   ENTER GALLERY — the morph sequence
   =====================================================
   Phase 1 (0ms):    Lock frame position, detach to fixed,
                     expand to gallery size. Outline rect fades in.
                     Intro chrome fades out.
   Phase 2 (150ms):  Load gallery image silently under overlay.
   Phase 3 (800ms):  Overlay lifts. Gallery chrome slides in.
   Phase 4 (1450ms): Tap-to-zoom enabled.
   ===================================================== */
function enterGallery(collectionKey) {
  currentCollection = GALLERY[collectionKey] || [];
  currentIndex = 0;
  if (!currentCollection.length) return;
  state = 'morphing';

  const frame   = document.getElementById('unified-frame');
  const overlay = document.getElementById('intro-overlay');
  const logoEl  = document.getElementById('logo');
  const rect    = document.getElementById('outline-rect');

  // ── Phase 1: frame is already fixed — just prepare for animation ──
  // Disable transition briefly so the starting position doesn't animate
  frame.style.transition = 'none';
  // positionFrame() already set top/left to match spacer — force a reflow
  void frame.offsetHeight;
  // Re-enable transition for the expansion animation
  frame.style.transition = '';
  frame.classList.add('detached'); // triggers frame-inner border-radius via CSS

  // Clear inline positional styles, add gallery class, then set bottom inline.
  // Using bottom means we never need to know the nav's height.
  const navEl = document.getElementById('nav-unified');
  navEl.style.left      = '';
  navEl.style.right     = '';
  navEl.style.top       = 'auto';
  navEl.style.transform = '';
  navEl.classList.remove('no-transition');
  navEl.classList.add('gallery');
  // bottom: 8vh keeps the nav's bottom edge 8vh from the viewport bottom
  navEl.style.bottom = 'clamp(24px, 8vh, 60px)';

  // Fade plate in — covers intro portrait as frame expands
  document.getElementById('photo-plate').classList.add('visible');

  // Hide other intro chrome
  const labelEl = document.getElementById('visions-label');
  labelEl.style.opacity = '0';
  labelEl.style.left = (parseFloat(labelEl.style.left || '0') - 20) + 'px';
  document.getElementById('intro-scene').style.pointerEvents = 'none';
  document.getElementById('red-line').classList.add('hidden');

  // Two rAFs to ensure the fixed position is painted before we start moving
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const { w: gw, h: gh } = galleryFrameSize();
    const gap = vh * 0.04;

    // Animate to centred gallery size
    frame.style.top    = '50%';
    frame.style.left   = '50%';
    // Logo and info move simultaneously with the frame
    positionLogoAndInfo(currentCollection[0], false);
    frame.style.transform = 'translate(-50%, -50%)';
    frame.style.width  = gw + 'px';
    frame.style.height = gh + 'px';
    // border-radius is handled by CSS:
    // #unified-frame.detached #frame-inner { border-radius: 12vh }

    // Outline rect tracks the frame
    rect.style.width        = (gw + gap * 2) + 'px';
    rect.style.height       = (gh + gap * 2) + 'px';
    rect.style.top          = ((vh - gh) / 2 - gap) + 'px';
    rect.style.left         = ((vw - gw) / 2 - gap) + 'px';
    rect.style.borderRadius = 'calc(12vh + 4vh)';
    rect.classList.add('rect-visible');
  }));

  // ── Phase 2: load image under overlay ──
  setTimeout(() => {
    preloadNeighbours(0);
    loadSlideUnder(0);
  }, 150);

  // ── Phase 3: lift overlay, show chrome ──
  setTimeout(() => {
    overlay.classList.add('lifted');
    showGalleryChrome();
    loadSlide(0, false);
  }, 800);

  // ── Phase 4: enable zoom ──
  setTimeout(() => {
    const tap = document.getElementById('gallery-tap');
    tap.classList.add('active');
state = 'gallery';
  }, 1450);
}

function exitGallery() {

  // which is also fading out, creating a layered dissolve back to jnb

  // Plate fades out — reveals intro portrait under the closing overlay
  document.getElementById('photo-plate').classList.remove('visible');

  // Logo moves to intro position immediately
  positionLogoIntro();

  // Nav snaps back instantly (no transition), then re-enables
  const navElExit = document.getElementById('nav-unified');
  navElExit.classList.add('no-transition');
  navElExit.classList.remove('gallery');
  navElExit.style.bottom = 'auto';
  positionIntroNav();
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      navElExit.classList.remove('no-transition');
    });
  });

  // ── Phase 2: contract frame, revert border-radius simultaneously ──
  setTimeout(() => {
    const vw = window.innerWidth;
    const cardW = Math.min(Math.min(300, vw * 0.72), vw * 0.55);
    const cardH = cardW * 1.32;
    frame.style.width  = cardW + 'px';
    frame.style.height = cardH + 'px';
    // Remove .detached now so border-radius transitions back to 22px
    // at the same time as the frame contracts — not delayed to Phase 3
    frame.classList.remove('detached');
    rect.classList.remove('rect-visible');
    document.getElementById('red-line').classList.remove('hidden');
  }, 300);

  // ── Phase 3: reattach to flex layout ──
  setTimeout(() => {
    // Remove all inline positioning before reattaching
    // Snap frame back to spacer position (no transition)
    // .detached already removed in Phase 2; just snap position
    frame.style.transition = 'none';
    positionFrame();
    void frame.offsetHeight;
    frame.style.transition = '';
    rect.style.cssText = '';

    photo.style.objectPosition = '50% 50%';
    photo.src = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';

    positionVisionsLabel(); // slides label back and restores opacity
    document.getElementById('intro-scene').style.pointerEvents = 'all';

    // Re-anchor frame position after snap
    positionFrame();

    state = 'intro';
  }, 1100);
}

/* =====================================================
   LOAD SLIDE UNDER OVERLAY
   Silently sets the gallery-photo src so it's ready
   before the overlay lifts. Does not trigger opacity.
   ===================================================== */
function loadSlideUnder(index) {
  const slide = currentCollection[index];
  if (!slide) return;
  const photo = document.getElementById('gallery-photo');
  photo.style.objectPosition = '50% 50%';

  const apply = () => { photo.src = slide.src; };

  if (imageCache.has(slide.src) && imageCache.get(slide.src) !== null) {
    apply();
  } else {
    const img = new Image();
    img.onload  = () => { imageCache.set(slide.src, img); apply(); };
    img.onerror = () => { imageCache.set(slide.src, null); };
    img.src = slide.src;
  }
}

/* =====================================================
   IMAGE CACHE
   Each src is fetched at most once per session. After the
   first fetch the browser's memory cache serves it instantly,
   but we also keep our own Map so we can check synchronously
   whether an image is already ready before showing it.
   ===================================================== */
const imageCache = new Map(); // src → HTMLImageElement (decoded)

function preloadImage(src) {
  if (!src || imageCache.has(src)) return;
  const img = new Image();
  img.onload  = () => imageCache.set(src, img);
  img.onerror = () => imageCache.set(src, null); // null = failed, don't retry
  img.src = src;
}

function preloadNeighbours(index) {
  const len = currentCollection.length;
  // Preload next and previous, wrapping around
  preloadImage(currentCollection[(index + 1) % len]?.src);
  preloadImage(currentCollection[(index - 1 + len) % len]?.src);
}

/* =====================================================
   LOAD A SLIDE
   ===================================================== */
function loadSlide(index, animate) {
  const slide = currentCollection[index];
  if (!slide) return;

  const photo = document.getElementById('gallery-photo');
  const infoFirst = document.getElementById('info-first');
  const infoLast  = document.getElementById('info-last');

  if (animate) photo.classList.remove('loaded');

  // Always reset to centre when switching slides
  photo.style.objectPosition = '50% 50%';

  // Kick off neighbour preloads immediately (no-ops if already cached)
  preloadNeighbours(index);

  const delay = animate ? 220 : 0;

  setTimeout(() => {
    infoFirst.textContent = slide.first;
    infoLast.textContent  = slide.last;

    const apply = () => {
      photo.src = slide.src;
      setTimeout(() => photo.classList.add('loaded'), 30);
    };

    if (imageCache.has(slide.src) && imageCache.get(slide.src) !== null) {
      // Already in cache — show instantly
      apply();
    } else {
      // Not yet cached — fetch, cache, then show
      const img = new Image();
      img.onload = () => {
        imageCache.set(slide.src, img);
        apply();
      };
      img.onerror = () => {
        imageCache.set(slide.src, null);
        photo.style.background = 'linear-gradient(135deg, #1a0000 0%, #3d0010 50%, #0a0000 100%)';
        photo.classList.add('loaded');
      };
      img.src = slide.src;
    }

    positionLogoAndInfo(slide, false);
  }, delay);
}

/* =====================================================
   LOGO + INFO POSITIONING
   ===================================================== */
function positionLogoAndInfo(slide, expanded) {
  const logoEl  = document.getElementById('logo');
  const infoEl  = document.getElementById('info-panel');
  const wrapRect = document.getElementById('unified-frame').getBoundingClientRect();

  const logoW = expanded ? LOGO_SIZES.expanded : LOGO_SIZES.gallery;
  const logoY_pct = (slide.logoY ?? 80) / 100;

  if (!expanded) {
    const logoLeft = wrapRect.left - logoW * 0.38;
    const logoTop  = wrapRect.top + wrapRect.height * logoY_pct - 30;
    logoEl.style.width     = logoW + 'px';
    logoEl.style.left      = logoLeft + 'px';
    logoEl.style.top       = logoTop + 'px';
    logoEl.style.transform = 'none';
    logoEl.style.opacity   = '1';

    const infoRight = window.innerWidth - (wrapRect.right + 20);
    const infoTop   = window.innerHeight * ((slide.infoY ?? 55) / 100);
    infoEl.style.top    = infoTop + 'px';
    infoEl.style.right  = Math.max(infoRight, 16) + 'px';
    infoEl.style.opacity = '1';
    infoEl.classList.add('visible');
  } else {
    logoEl.style.width     = (logoW * 1.35) + 'px';
    logoEl.style.left      = (window.innerWidth / 2 - (logoW * 1.35) / 2) + 'px';
    logoEl.style.top       = (wrapRect.bottom - 30) + 'px';
    logoEl.style.transform = 'none';

    infoEl.style.top    = (wrapRect.bottom - 90) + 'px';
    infoEl.style.right  = (window.innerWidth - wrapRect.left - wrapRect.width * 0.42) + 'px';
    infoEl.style.opacity = '1';
  }
}

/* =====================================================
   FRAME SIZE HELPERS
   ===================================================== */

// Gallery (normal) frame dimensions
function galleryFrameSize() {
  const vw = window.innerWidth;
  const w = Math.min(480, vw * 0.82);
  return { w, h: w * 1.28 };
}

// Expanded frame dimensions — viewport-responsive
// Landscape viewport: aspect ratio flip using slide.zoomRatio
// Portrait viewport:  slight grow, portrait ratio preserved
function expandedFrameSize(slide) {
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const isLandscape = vw > vh;

  if (isLandscape) {
    // Aspect ratio flip — width-dominant, ratio from config
    const ratio = slide.zoomRatio ?? 0.65;
    const w = Math.min(800, vw * 0.88);
    return { w, h: w * ratio };
  } else {
    // Focal crop — slight grow, keep portrait ratio
    const w = Math.min(540, vw * 0.88);
    return { w, h: w * 1.28 };
  }
}

/* =====================================================
   TOGGLE EXPANDED
   ===================================================== */
function toggleExpanded() {
  if (state === 'morphing') return;
  const frame = document.getElementById('unified-frame');
  const photo = document.getElementById('gallery-photo');
  const rect  = document.getElementById('outline-rect');
  const slide = currentCollection[currentIndex];
  isExpanded  = !isExpanded;

  const vw  = window.innerWidth;
  const vh  = window.innerHeight;
  const gap = vh * 0.04;

  if (isExpanded) {
    state = 'expanded';
    const { w: ew, h: eh } = expandedFrameSize(slide);
    frame.style.width  = ew + 'px';
    frame.style.height = eh + 'px';
    rect.style.left    = ((vw - ew) / 2 - gap) + 'px';
    rect.style.top     = ((vh - eh) / 2 - gap) + 'px';
    rect.style.width   = (ew + gap * 2) + 'px';
    rect.style.height  = (eh + gap * 2) + 'px';
    const [ax, ay] = slide.zoomAnchor ?? [50, 50];
    photo.style.objectPosition = `${ax}% ${ay}%`;
    setTimeout(() => positionLogoAndInfo(slide, true), 780);
  } else {
    state = 'gallery';
    const { w: gw, h: gh } = galleryFrameSize();
    frame.style.width  = gw + 'px';
    frame.style.height = gh + 'px';
    rect.style.left    = ((vw - gw) / 2 - gap) + 'px';
    rect.style.top     = ((vh - gh) / 2 - gap) + 'px';
    rect.style.width   = (gw + gap * 2) + 'px';
    rect.style.height  = (gh + gap * 2) + 'px';
    photo.style.objectPosition = '50% 50%';
    setTimeout(() => positionLogoAndInfo(slide, false), 780);
  }
}

/* =====================================================
   NAVIGATION
   ===================================================== */
function navigate(dir) {
  if (state === 'morphing') return;
  const len = currentCollection.length;
  currentIndex = (currentIndex + dir + len) % len;
  if (isExpanded) {
    isExpanded = false;
    const frame = document.getElementById('unified-frame');
    const rect  = document.getElementById('outline-rect');
    const vw = window.innerWidth, vh = window.innerHeight;
    const { w: gw, h: gh } = galleryFrameSize();
    const gap = vh * 0.04;
    frame.style.width  = gw + 'px';
    frame.style.height = gh + 'px';
    rect.style.left    = ((vw - gw) / 2 - gap) + 'px';
    rect.style.top     = ((vh - gh) / 2 - gap) + 'px';
    rect.style.width  = (gw + gap * 2) + 'px';
    rect.style.height = (gh + gap * 2) + 'px';
    document.getElementById('gallery-photo').style.objectPosition = '50% 50%';
    state = 'gallery';
  }
  loadSlide(currentIndex, true);
}

/* =====================================================
   NAV POSITIONING
   Reads the frame's actual right edge so the nav column
   sits flush with it, and computes the Gallery rise transform.
   Called on load and on resize.
   ===================================================== */
function positionFrame() {
  const frame  = document.getElementById('unified-frame');
  const spacer = document.getElementById('intro-spacer');
  if (!frame || !spacer) return;
  const sr = spacer.getBoundingClientRect();
  frame.style.top       = sr.top  + 'px';
  frame.style.left      = sr.left + 'px';
  frame.style.width     = sr.width  + 'px';
  frame.style.height    = sr.height + 'px';
  frame.style.transform = 'none';
}

function positionIntroNav() {
  const nav    = document.getElementById('nav-unified');
  const spacer = document.getElementById('intro-spacer');
  if (!nav || !spacer) return;
  const sr  = spacer.getBoundingClientRect();
  const gap = 28;
  nav.style.left      = (sr.right + gap) + 'px';
  nav.style.top       = '50%';
  nav.style.right     = 'auto';
  nav.style.bottom    = 'auto';
  nav.style.transform = 'translateY(-50%)';
}

function positionLogoIntro() {
  // Position logo centred over the intro card.
  // Reads the spacer (document flow, always at final position) rather than
  // the frame (position:fixed, may be mid-transition when this is called).
  const logo   = document.getElementById('logo');
  const spacer = document.getElementById('intro-spacer');
  if (!logo || !spacer) return;
  const sr    = spacer.getBoundingClientRect();
  const logoW = LOGO_SIZES.intro;
  logo.style.width     = logoW + 'px';
  logo.style.left      = (sr.left + sr.width  / 2 - logoW / 2) + 'px';
  logo.style.top       = (sr.top  + sr.height / 2 - logoW / 2) + 'px';
  logo.style.transform = 'none';
  logo.style.opacity   = '1';
}

function positionVisionsLabel() {
  const label  = document.getElementById('visions-label');
  const spacer = document.getElementById('intro-spacer');
  if (!label || !spacer) return;
  const sr  = spacer.getBoundingClientRect();
  const vh  = window.innerHeight;
  const gap = 20; // px gap between label right edge and spacer left edge
  // Label is vertical text — its rendered width is its font size, height is its content
  const lw = label.offsetWidth;
  label.style.left = (sr.left - gap - lw) + 'px';
  label.style.top  = (vh / 2 - label.offsetHeight / 2) + 'px';
  label.style.opacity = '1';
}

function positionIntroAll() {
  positionFrame();
  positionIntroNav();
  positionVisionsLabel();
  positionLogoIntro();
}

      const gap = vh * 0.04;
      const frame = document.getElementById('unified-frame');
      let fw, fh;
      if (isExpanded) {
        const es = expandedFrameSize(currentCollection[currentIndex]);
        fw = es.w; fh = es.h;
      } else {
        const gs = galleryFrameSize();
        fw = gs.w; fh = gs.h;
      }
      frame.style.width  = fw + 'px';
      frame.style.height = fh + 'px';
      const rect = document.getElementById('outline-rect');
      rect.style.left   = ((vw - fw) / 2 - gap) + 'px';
      rect.style.top    = ((vh - fh) / 2 - gap) + 'px';
      rect.style.width  = (fw + gap * 2) + 'px';
      rect.style.height = (fh + gap * 2) + 'px';
      positionLogoAndInfo(currentCollection[currentIndex], isExpanded);
    }
  }, 120);
});

/* =====================================================
   CONTEXT MENU
   Suppressed by default. Cmd+K (Mac) / Ctrl+K toggles it
   back on for development, then off again.
   ===================================================== */
let contextMenuEnabled = false;
document.addEventListener('contextmenu', e => {
  if (!contextMenuEnabled) e.preventDefault();
});
document.addEventListener('keydown', e => {
  if (e.key === 'k' && (e.metaKey || e.ctrlKey)) {
    e.preventDefault();
    contextMenuEnabled = !contextMenuEnabled;
    const msg = document.createElement('div');
    msg.textContent = contextMenuEnabled ? 'Context menu ON' : 'Context menu OFF';
    Object.assign(msg.style, {
      position: 'fixed', bottom: '48px', left: '50%',
      transform: 'translateX(-50%)',
      background: 'rgba(255,255,255,0.08)',
      color: 'rgba(255,255,255,0.55)',
      fontFamily: 'var(--font-secondary)',
      fontSize: '9px', letterSpacing: '0.22em',
      textTransform: 'uppercase',
      padding: '7px 16px', borderRadius: '2px',
      pointerEvents: 'none', zIndex: '99999',
      transition: 'opacity 0.3s ease', opacity: '1'
    });
    document.body.appendChild(msg);
    setTimeout(() => { msg.style.opacity = '0'; }, 1200);
    setTimeout(() => { msg.remove(); }, 1600);
  }
  if (e.key === 'ArrowRight' && (state === 'gallery' || state === 'expanded')) navigate(1);
  if (e.key === 'ArrowLeft'  && (state === 'gallery' || state === 'expanded')) navigate(-1);
  if (e.key === 'Escape') {
    if (state === 'expanded') {
      toggleExpanded();
    } else if (state === 'gallery') {
      exitGallery();
    }
  }
});

/* =====================================================
   CUSTOM CURSOR
   ORBIT_DISTANCE  px from core centre to orbiter at rest
   ORBIT_LAG       angle smoothing (0 = instant, higher = more drag)
   PRESS_DISTANCE  compressed distance while held down
*/
const ORBIT_DISTANCE = 22;
const ORBIT_LAG      = 0.12;
const PRESS_DISTANCE = 8;

const cursorCore       = document.getElementById('cursor-core');
const cursorOrbiterPos = document.getElementById('cursor-orbiter-pos');
const cursorOrbiter    = document.getElementById('cursor-orbiter');

let mouseX     = -999;
let mouseY     = -999;
let orbitAngle = 0;
let targetAngle= 0;
let orbitDist  = ORBIT_DISTANCE;
let cursorDown = false;
let cursorRaf  = null;
let cursorVisible = false;

function showCursor() {
  if (cursorVisible) return;
  cursorVisible = true;
  cursorCore.style.opacity       = '1';
  cursorOrbiterPos.style.opacity = '1';
}
function hideCursor() {
  cursorVisible = false;
  cursorCore.style.opacity       = '0';
  cursorOrbiterPos.style.opacity = '0';
}

function lerpAngle(a, b, t) {
  let d = b - a;
  while (d >  Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

function runCursorLoop() {
  const halfCore = 2.5;
  cursorCore.style.transform = `translate(${mouseX - halfCore}px, ${mouseY - halfCore}px)`;

  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;
  targetAngle = Math.atan2(mouseY - cy, mouseX - cx);
  orbitAngle  = lerpAngle(orbitAngle, targetAngle, 1 - ORBIT_LAG);

  const ox = mouseX + Math.cos(orbitAngle) * orbitDist;
  const oy = mouseY + Math.sin(orbitAngle) * orbitDist;
  cursorOrbiterPos.style.transform = `translate(${ox}px, ${oy}px)`;

  cursorRaf = requestAnimationFrame(runCursorLoop);
}

cursorRaf = requestAnimationFrame(runCursorLoop);

document.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
  showCursor();
});
document.addEventListener('mouseleave', hideCursor);
document.addEventListener('mouseenter', showCursor);

function cursorPressDown(e) {
  cursorDown = true;
  cursorOrbiter.classList.remove('springing', 'pressed-left', 'pressed-right');
  if (e && e.button === 2) {
    cursorOrbiter.classList.add('pressed-right');
  } else {
    orbitDist = PRESS_DISTANCE;
    cursorOrbiter.classList.add('pressed-left');
  }
}
function cursorPressUp(e) {
  if (!cursorDown) return;
  cursorDown = false;
  if (e && e.button === 2) {
    cursorOrbiter.classList.remove('pressed-right');
  } else {
    orbitDist = ORBIT_DISTANCE;
    cursorOrbiter.classList.remove('pressed-left');
    void cursorOrbiter.offsetWidth;
    cursorOrbiter.classList.add('springing');
    cursorOrbiter.addEventListener('animationend',
      () => cursorOrbiter.classList.remove('springing'), { once: true });
  }
}

document.addEventListener('mousedown', cursorPressDown);
document.addEventListener('mouseup',   cursorPressUp);

/* Touch support — cursor tracking + swipe navigation + long-press hook */
const SWIPE_THRESHOLD  = 48;
const SWIPE_MAX_VERT   = 80;
let touchStartX    = 0;
let touchStartY    = 0;
let touchDeltaX    = 0;
let touchMoved     = false;
let longPressTimer = null;

document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  touchStartX = t.clientX;
  touchStartY = t.clientY;
  touchDeltaX = 0;
  touchMoved  = false;
  showCursor();
  cursorPressDown(e);
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
  }, 500);
}, { passive: true });

document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouseX = t.clientX;
  mouseY = t.clientY;
  touchDeltaX = t.clientX - touchStartX;
  touchMoved  = true;
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
}, { passive: true });

document.addEventListener('touchend', e => {
  cursorPressUp(e);
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  if (touchMoved && (state === 'gallery' || state === 'expanded')) {
    const vertDelta = Math.abs(e.changedTouches[0].clientY - touchStartY);
    if (Math.abs(touchDeltaX) >= SWIPE_THRESHOLD && vertDelta <= SWIPE_MAX_VERT) {
      navigate(touchDeltaX < 0 ? 1 : -1);
    }
  }
  touchMoved = false;
});
</script>

<!-- CUSTOM CURSOR -->
<div id="cursor-core"></div>
<div id="cursor-orbiter-pos">
  <div id="cursor-orbiter"><div id="cursor-orbiter-fill"></div></div>
</div>

</body>
